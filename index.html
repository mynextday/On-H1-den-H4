.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.rv{border-left:4px solid var(--jade);padding:6px 12px;margin:10px 0;background:var(--bg);border-radius:6px}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}

.opt .o1,.tok .o1{display:block}

.wd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}

.gp{border-top:1px solid var(--line);padding:0 16px}

</style>

const LVDESC={1:'500 từ · 300 chữ Hán: chào hỏi, số đếm, đời sống',2:'772 từ mới (cộng dồn 1.272) · 600 chữ Hán: kể việc, nối câu',3:'973 từ mới (cộng dồn 2.245) · 900 chữ Hán: công việc, diễn đạt ý',4:'1.000 từ mới (cộng dồn 3.245) · 1.200 chữ Hán: giao tiếp công sở'};
const TARGET={1:500,2:772,3:973,4:1000};/* số từ mới mỗi cấp theo chuẩn HSK 3.0 */

const TEXTS=[{"id":"t01","l":1,"k":"dialogue","t":"Làm quen","lines":[["A","你好！我叫王明，你叫什么名字？","Nǐ hǎo! Wǒ jiào Wáng Míng, nǐ jiào shénme míngzi?","Xin chào! Tôi tên là Vương Minh, bạn tên là gì?"],["B","你好！我叫阮安，我是越南人。","Nǐ hǎo! Wǒ jiào Ruǎn Ān, wǒ shì Yuènán rén.","Xin chào! Tôi tên là Nguyễn An, tôi là người Việt Nam."],["A","我是中国人。认识你很高兴。","Wǒ shì Zhōngguó rén. Rènshi nǐ hěn gāoxìng.","Tôi là người Trung Quốc. Rất vui được quen bạn."],["B","我也很高兴。","Wǒ yě hěn gāoxìng.","Tôi cũng rất vui."]],"qs":[{"z":"王明是哪国人？","v":"Vương Minh là người nước nào?","o":["越南人","中国人","不知道"],"a":1,"s":2},{"z":"阮安是哪国人？","v":"Nguyễn An là người nước nào?","o":["越南人","中国人","不知道"],"a":0,"s":1}]},{"id":"t02","l":1,"k":"dialogue","t":"Mua trà","lines":[["A","你好，我想买茶。","Nǐ hǎo, wǒ xiǎng mǎi chá.","Xin chào, tôi muốn mua trà."],["B","好的。这个茶很好，你喜欢吗？","Hǎo de. Zhège chá hěn hǎo, nǐ xǐhuan ma?","Vâng. Trà này rất ngon, bạn có thích không?"],["A","我喜欢。多少钱？","Wǒ xǐhuan. Duōshao qián?","Tôi thích. Bao nhiêu tiền?"],["B","二十块。","Èrshí kuài.","Hai mươi tệ."],["A","好，我买一个。谢谢！","Hǎo, wǒ mǎi yí gè. Xièxie!","Được, tôi mua một cái. Cảm ơn!"],["B","不客气，再见！","Bú kèqi, zàijiàn!","Đừng khách sáo, tạm biệt!"]],"qs":[{"z":"茶多少钱？","v":"Trà bao nhiêu tiền?","o":["十块","二十块","三十块"],"a":1,"s":3},{"z":"A买几个？","v":"A mua mấy cái?","o":["一个","两个","三个"],"a":0,"s":4}]},{"id":"t03","l":1,"k":"dialogue","t":"Hỏi về gia đình","lines":[["A","你家有几个人？","Nǐ jiā yǒu jǐ gè rén?","Nhà bạn có mấy người?"],["B","我家有四个人：爸爸、妈妈、哥哥和我。","Wǒ jiā yǒu sì gè rén: bàba, māma, gēge hé wǒ.","Nhà tôi có bốn người: bố, mẹ, anh trai và tôi."],["A","你爸爸在哪儿工作？","Nǐ bàba zài nǎr gōngzuò?","Bố bạn làm việc ở đâu?"],["B","他在学校工作，他是老师。","Tā zài xuéxiào gōngzuò, tā shì lǎoshī.","Bố tôi làm việc ở trường, ông ấy là giáo viên."]],"qs":[{"z":"B家有几个人？","v":"Nhà B có mấy người?","o":["三个人","四个人","五个人"],"a":1,"s":1},{"z":"爸爸在哪儿工作？","v":"Bố làm việc ở đâu?","o":["家","学校","中国"],"a":1,"s":3}]},{"id":"t04","l":1,"k":"passage","t":"Một ngày của Tiểu Minh","lines":[["","我叫小明，我是学生。","Wǒ jiào Xiǎo Míng, wǒ shì xuésheng.","Tôi tên là Tiểu Minh, tôi là học sinh."],["","我每天去学校学习汉语。","Wǒ měitiān qù xuéxiào xuéxí Hànyǔ.","Mỗi ngày tôi đến trường học tiếng Hán."],["","我的老师是中国人，她很好。","Wǒ de lǎoshī shì Zhōngguó rén, tā hěn hǎo.","Giáo viên của tôi là người Trung Quốc, cô ấy rất tốt."],["","我喜欢我的学校。","Wǒ xǐhuan wǒ de xuéxiào.","Tôi thích trường của tôi."],["","明天我想和朋友去买东西。","Míngtiān wǒ xiǎng hé péngyou qù mǎi dōngxi.","Ngày mai tôi muốn cùng bạn đi mua đồ."]],"qs":[{"z":"小明每天去哪儿？","v":"Mỗi ngày Tiểu Minh đi đâu?","o":["家","学校","中国"],"a":1,"s":1},{"z":"明天小明想做什么？","v":"Ngày mai Tiểu Minh muốn làm gì?","o":["去买东西","去学校","喝茶"],"a":0,"s":4}]},{"id":"t05","l":1,"k":"dialogue","t":"Hỏi đường","lines":[["A","请问，火车站在哪儿？","Qǐngwèn, huǒchēzhàn zài nǎr?","Xin hỏi, ga tàu hỏa ở đâu?"],["B","就在前面，不远。你走路去，很快。","Jiù zài qiánmiàn, bù yuǎn. Nǐ zǒulù qù, hěn kuài.","Ngay phía trước, không xa. Bạn đi bộ đến, rất nhanh."],["A","走路要多少分钟？","Zǒulù yào duōshao fēnzhōng?","Đi bộ mất bao nhiêu phút?"],["B","五分钟。","Wǔ fēnzhōng.","Năm phút."],["A","谢谢！","Xièxie!","Cảm ơn!"],["B","不客气。","Bú kèqi.","Đừng khách sáo."]],"qs":[{"z":"火车站远吗？","v":"Ga tàu hỏa có xa không?","o":["远","不远","不知道"],"a":1,"s":1},{"z":"走路要几分钟？","v":"Đi bộ mất mấy phút?","o":["三分钟","五分钟","十分钟"],"a":1,"s":3}]},{"id":"t06","l":1,"k":"dialogue","t":"Hỏi giờ giấc","lines":[["A","现在几点？","Xiànzài jǐ diǎn?","Bây giờ mấy giờ?"],["B","现在七点。","Xiànzài qī diǎn.","Bây giờ bảy giờ."],["A","我八点去公司，你呢？","Wǒ bā diǎn qù gōngsī, nǐ ne?","Tám giờ tôi đến công ty, còn bạn?"],["B","我九点去学校。","Wǒ jiǔ diǎn qù xuéxiào.","Chín giờ tôi đến trường."]],"qs":[{"z":"B几点去学校？","v":"B mấy giờ đến trường?","o":["七点","八点","九点"],"a":2,"s":3},{"z":"A几点去公司？","v":"A mấy giờ đến công ty?","o":["七点","八点","九点"],"a":1,"s":2}]},{"id":"t07","l":1,"k":"dialogue","t":"Gọi món ở nhà hàng","lines":[["服务员","你好，你们想吃什么？","Nǐ hǎo, nǐmen xiǎng chī shénme?","Xin chào, các bạn muốn ăn gì?"],["A","我想吃鱼和米饭。你呢？","Wǒ xiǎng chī yú hé mǐfàn. Nǐ ne?","Tôi muốn ăn cá và cơm. Còn bạn?"],["B","我要一个菜和一杯茶。","Wǒ yào yí gè cài hé yì bēi chá.","Tôi lấy một món và một cốc trà."],["服务员","好的，请等一下。","Hǎo de, qǐng děng yíxià.","Vâng, xin chờ một chút."]],"qs":[{"z":"A想吃什么？","v":"A muốn ăn gì?","o":["鱼和米饭","面条","苹果"],"a":0,"s":1},{"z":"B要什么喝的？","v":"B gọi đồ uống gì?","o":["咖啡","茶","水"],"a":1,"s":2}]},{"id":"t08","l":2,"k":"dialogue","t":"Bị cảm","lines":[["A","你怎么了？","Nǐ zěnme le?","Bạn sao vậy?"],["B","我昨天感冒了，今天头疼。","Wǒ zuótiān gǎnmào le, jīntiān tóuténg.","Hôm qua tôi bị cảm, hôm nay đau đầu."],["A","你吃药了吗？","Nǐ chī yào le ma?","Bạn uống thuốc chưa?"],["B","已经吃了，但是还不太舒服。","Yǐjīng chī le, dànshì hái bú tài shūfu.","Uống rồi, nhưng vẫn chưa khỏe lắm."],["A","你应该去医院，也要多休息。","Nǐ yīnggāi qù yīyuàn, yě yào duō xiūxi.","Bạn nên đến bệnh viện, cũng cần nghỉ ngơi nhiều."]],"qs":[{"z":"B今天怎么了？","v":"Hôm nay B bị sao?","o":["头疼","很高兴","很忙"],"a":0,"s":1},{"z":"A建议B做什么？","v":"A khuyên B làm gì?","o":["去医院","去旅游","去学校"],"a":0,"s":4}]},{"id":"t09","l":2,"k":"dialogue","t":"Hẹn đi du lịch","lines":[["A","周末你有时间吗？","Zhōumò nǐ yǒu shíjiān ma?","Cuối tuần bạn có thời gian không?"],["B","有，怎么了？","Yǒu, zěnme le?","Có, sao vậy?"],["A","我们一起去旅游，好吗？","Wǒmen yìqǐ qù lǚyóu, hǎo ma?","Chúng ta cùng đi du lịch, được không?"],["B","好啊！我们坐火车还是坐飞机？","Hǎo a! Wǒmen zuò huǒchē háishi zuò fēijī?","Được chứ! Chúng ta đi tàu hỏa hay máy bay?"],["A","坐火车比较便宜。","Zuò huǒchē bǐjiào piányi.","Đi tàu hỏa tương đối rẻ."]],"qs":[{"z":"他们想做什么？","v":"Họ muốn làm gì?","o":["旅游","工作","学习"],"a":0,"s":2},{"z":"为什么坐火车？","v":"Vì sao đi tàu hỏa?","o":["比较便宜","比较快","比较近"],"a":0,"s":4}]},{"id":"t10","l":2,"k":"passage","t":"Cuối tuần của tôi","lines":[["","我平时很忙，周末才有时间休息。","Wǒ píngshí hěn máng, zhōumò cái yǒu shíjiān xiūxi.","Ngày thường tôi rất bận, cuối tuần mới có thời gian nghỉ ngơi."],["","星期六早上我去超市买东西，下午在家看书。","Xīngqīliù zǎoshang wǒ qù chāoshì mǎi dōngxi, xiàwǔ zài jiā kàn shū.","Sáng thứ bảy tôi đi siêu thị mua đồ, chiều ở nhà đọc sách."],["","星期天我常常和朋友一起去公园。","Xīngqītiān wǒ chángcháng hé péngyou yìqǐ qù gōngyuán.","Chủ nhật tôi thường cùng bạn bè đi công viên."],["","因为周末很开心，所以我很喜欢周末。","Yīnwèi zhōumò hěn kāixīn, suǒyǐ wǒ hěn xǐhuan zhōumò.","Vì cuối tuần rất vui nên tôi rất thích cuối tuần."]],"qs":[{"z":"星期六下午他做什么？","v":"Chiều thứ bảy anh ấy làm gì?","o":["在家看书","去公园","去超市"],"a":0,"s":1},{"z":"星期天他常常做什么？","v":"Chủ nhật anh ấy thường làm gì?","o":["和朋友去公园","工作","学习汉语"],"a":0,"s":2}]},{"id":"t11","l":3,"k":"dialogue","t":"Xin nghỉ phép","lines":[["员工","经理，我想请一天假。","Jīnglǐ, wǒ xiǎng qǐng yì tiān jià.","Giám đốc, tôi muốn xin nghỉ một ngày."],["经理","为什么？","Wèishénme?","Tại sao?"],["员工","我明天要搬家，需要一天时间。","Wǒ míngtiān yào bānjiā, xūyào yì tiān shíjiān.","Ngày mai tôi phải chuyển nhà, cần một ngày."],["经理","可以，但是你要先安排好工作。","Kěyǐ, dànshì nǐ yào xiān ānpái hǎo gōngzuò.","Được, nhưng bạn cần sắp xếp xong công việc trước."],["员工","好的，今天下班以前我一定完成。","Hǎo de, jīntiān xiàbān yǐqián wǒ yídìng wánchéng.","Vâng, trước khi tan làm hôm nay tôi nhất định hoàn thành."]],"qs":[{"z":"员工为什么请假？","v":"Vì sao nhân viên xin nghỉ?","o":["要搬家","生病了","要旅游"],"a":0,"s":2},{"z":"经理要他先做什么？","v":"Giám đốc yêu cầu anh ấy làm gì trước?","o":["安排好工作","去搬家","去医院"],"a":0,"s":3}]},{"id":"t12","l":3,"k":"dialogue","t":"Phỏng vấn xin việc","lines":[["经理","请先介绍一下你自己。","Qǐng xiān jièshào yíxià nǐ zìjǐ.","Xin hãy giới thiệu bản thân trước."],["王明","我叫王明，三年前大学毕业，以前在一家小公司工作。","Wǒ jiào Wáng Míng, sān nián qián dàxué bìyè, yǐqián zài yì jiā xiǎo gōngsī gōngzuò.","Tôi tên Vương Minh, ba năm trước tốt nghiệp đại học, trước đây làm ở một công ty nhỏ."],["经理","你为什么想来我们公司？","Nǐ wèishénme xiǎng lái wǒmen gōngsī?","Vì sao bạn muốn đến công ty chúng tôi?"],["王明","因为你们公司的机会很多，我想学习新的经验。","Yīnwèi nǐmen gōngsī de jīhuì hěn duō, wǒ xiǎng xuéxí xīn de jīngyàn.","Vì công ty các anh có nhiều cơ hội, tôi muốn học thêm kinh nghiệm mới."],["经理","好，我们会在三天内通知你结果。","Hǎo, wǒmen huì zài sān tiān nèi tōngzhī nǐ jiéguǒ.","Được, chúng tôi sẽ thông báo kết quả cho bạn trong ba ngày."]],"qs":[{"z":"王明什么时候大学毕业？","v":"Vương Minh tốt nghiệp đại học khi nào?","o":["一年前","三年前","五年前"],"a":1,"s":1},{"z":"经理会做什么？","v":"Giám đốc sẽ làm gì?","o":["三天内通知结果","马上签合同","明天面试"],"a":0,"s":4}]},{"id":"t13","l":3,"k":"passage","t":"Đi tìm nhà thuê","lines":[["","我下个月要搬家，所以最近一直在找房子。","Wǒ xià gè yuè yào bānjiā, suǒyǐ zuìjìn yìzhí zài zhǎo fángzi.","Tháng sau tôi phải chuyển nhà nên gần đây luôn đi tìm nhà."],["","我想租一个离公司近的房子，因为每天坐地铁太累了。","Wǒ xiǎng zū yí gè lí gōngsī jìn de fángzi, yīnwèi měitiān zuò dìtiě tài lèi le.","Tôi muốn thuê căn nhà gần công ty, vì ngày nào đi tàu điện ngầm cũng quá mệt."],["","昨天我看了三个房子，有一个很漂亮，但是太贵了。","Zuótiān wǒ kàn le sān gè fángzi, yǒu yí gè hěn piàoliang, dànshì tài guì le.","Hôm qua tôi xem ba căn nhà, có một căn rất đẹp nhưng đắt quá."],["","我还在考虑，明天再给房东打电话。","Wǒ hái zài kǎolǜ, míngtiān zài gěi fángdōng dǎ diànhuà.","Tôi vẫn đang cân nhắc, ngày mai sẽ gọi điện cho chủ nhà."]],"qs":[{"z":"他为什么想租离公司近的房子？","v":"Vì sao anh ấy muốn thuê nhà gần công ty?","o":["坐地铁太累","房子便宜","朋友在那儿"],"a":0,"s":1},{"z":"昨天他看了几个房子？","v":"Hôm qua anh ấy xem mấy căn nhà?","o":["两个","三个","四个"],"a":1,"s":2}]},{"id":"t14","l":4,"k":"passage","t":"Email thông báo họp","lines":[["","各位同事：大家好！","Gèwèi tóngshì: dàjiā hǎo!","Kính gửi các đồng nghiệp: chào mọi người!"],["","明天的会议时间改到上午十点，地点还是在三楼会议室。","Míngtiān de huìyì shíjiān gǎi dào shàngwǔ shí diǎn, dìdiǎn háishi zài sān lóu huìyìshì.","Giờ họp ngày mai đổi sang 10 giờ sáng, địa điểm vẫn ở phòng họp tầng ba."],["","请大家在会议以前把报告发给我，如果有问题，请今天下班以前告诉我。","Qǐng dàjiā zài huìyì yǐqián bǎ bàogào fā gěi wǒ, rúguǒ yǒu wèntí, qǐng jīntiān xiàbān yǐqián gàosu wǒ.","Nhờ mọi người gửi báo cáo cho tôi trước cuộc họp; nếu có vấn đề, xin báo tôi trước khi tan làm hôm nay."],["","谢谢！李经理","Xièxie! Lǐ jīnglǐ.","Cảm ơn! Giám đốc Lý."]],"qs":[{"z":"会议改到几点？","v":"Cuộc họp đổi sang mấy giờ?","o":["九点","十点","十一点"],"a":1,"s":1},{"z":"会议在哪儿开？","v":"Cuộc họp diễn ra ở đâu?","o":["三楼会议室","二楼","公司外面"],"a":0,"s":1},{"z":"大家什么时候发报告？","v":"Mọi người gửi báo cáo khi nào?","o":["会议以前","会议以后","明天下午"],"a":0,"s":2}]},{"id":"t15","l":4,"k":"dialogue","t":"Thương lượng với khách hàng","lines":[["客户","这个项目的价格比我想的高。","Zhège xiàngmù de jiàgé bǐ wǒ xiǎng de gāo.","Giá của dự án này cao hơn tôi nghĩ."],["经理","我理解。如果你们今年签合同，我们可以打九折。","Wǒ lǐjiě. Rúguǒ nǐmen jīnnián qiān hétong, wǒmen kěyǐ dǎ jiǔ zhé.","Tôi hiểu. Nếu năm nay các anh ký hợp đồng, chúng tôi có thể tính 90% giá (giảm 10%)."],["客户","除了价格，还有别的条件吗？","Chúle jiàgé, hái yǒu bié de tiáojiàn ma?","Ngoài giá cả, còn điều kiện nào khác không?"],["经理","我们会免费提供一年的服务。","Wǒmen huì miǎnfèi tígōng yì nián de fúwù.","Chúng tôi sẽ cung cấp dịch vụ miễn phí một năm."],["客户","好，我需要和同事讨论一下，明天给你答复。","Hǎo, wǒ xūyào hé tóngshì tǎolùn yíxià, míngtiān gěi nǐ dáfù.","Được, tôi cần bàn với đồng nghiệp, ngày mai sẽ trả lời anh."]],"qs":[{"z":"今年签合同，价格会怎么样？","v":"Nếu năm nay ký hợp đồng, giá sẽ thế nào?","o":["打九折","不变","更贵"],"a":0,"s":1},{"z":"客户什么时候给答复？","v":"Khách hàng trả lời khi nào?","o":["今天","明天","下个月"],"a":1,"s":4},{"z":"经理还提供什么？","v":"Giám đốc còn cung cấp gì?","o":["免费服务","免费午饭","免费机票"],"a":0,"s":3}]}];

const TEXTP=[{"id":"p1-01","l":1,"k":"podcast","t":"Podcast: Giới thiệu bản thân","lines":[["主持人","大家好！欢迎收听汉语小广播。","Dàjiā hǎo! Huānyíng shōutīng Hànyǔ xiǎo guǎngbō.","Xin chào mọi người! Chào mừng các bạn đến với chương trình phát thanh tiếng Trung nhỏ."],["主持人","我叫小林，我是中国人。","Wǒ jiào Xiǎo Lín, wǒ shì Zhōngguórén.","Tôi tên là Tiểu Lâm, tôi là người Trung Quốc."],["主持人","我今年二十五岁，我是老师。","Wǒ jīnnián èrshíwǔ suì, wǒ shì lǎoshī.","Năm nay tôi hai mươi lăm tuổi, tôi là giáo viên."],["主持人","我家有四口人：爸爸、妈妈、哥哥和我。","Wǒ jiā yǒu sì kǒu rén: bàba, māma, gēge hé wǒ.","Nhà tôi có bốn người: bố, mẹ, anh trai và tôi."],["主持人","我喜欢喝茶，也喜欢看书。","Wǒ xǐhuan hē chá, yě xǐhuan kànshū.","Tôi thích uống trà, cũng thích đọc sách."],["主持人","今天就说到这儿，再见！","Jīntiān jiù shuō dào zhèr, zàijiàn!","Hôm nay nói đến đây thôi, tạm biệt!"]],"qs":[{"z":"小林是哪国人？","v":"Tiểu Lâm là người nước nào?","o":["中国人","越南人","美国人"],"a":0,"s":1},{"z":"小林家有几口人？","v":"Nhà Tiểu Lâm có mấy người?","o":["三口人","四口人","五口人"],"a":1,"s":3}]},{"id":"p1-02","l":1,"k":"podcast","t":"Podcast: Một ngày của tôi","lines":[["主持人","大家好！我来说说我的一天。","Dàjiā hǎo! Wǒ lái shuō shuō wǒ de yì tiān.","Xin chào mọi người! Tôi sẽ kể về một ngày của tôi."],["主持人","我早上六点起床，七点吃早饭。","Wǒ zǎoshang liù diǎn qǐchuáng, qī diǎn chī zǎofàn.","Buổi sáng tôi dậy lúc sáu giờ, bảy giờ ăn sáng."],["主持人","八点我去公司工作，中午在公司吃饭。","Bā diǎn wǒ qù gōngsī gōngzuò, zhōngwǔ zài gōngsī chīfàn.","Tám giờ tôi đến công ty làm việc, buổi trưa ăn cơm ở công ty."],["主持人","下午六点我回家，晚上看电视。","Xiàwǔ liù diǎn wǒ huíjiā, wǎnshang kàn diànshì.","Sáu giờ chiều tôi về nhà, buổi tối xem tivi."],["主持人","我十点睡觉。","Wǒ shí diǎn shuìjiào.","Mười giờ tôi đi ngủ."],["主持人","你的一天是什么样的？","Nǐ de yì tiān shì shénmeyàng de?","Một ngày của bạn thế nào?"]],"qs":[{"z":"他几点起床？","v":"Anh ấy mấy giờ dậy?","o":["五点","六点","七点"],"a":1,"s":1},{"z":"他晚上做什么？","v":"Buổi tối anh ấy làm gì?","o":["看电视","看书","喝茶"],"a":0,"s":3}]},{"id":"p1-03","l":1,"k":"podcast","t":"Podcast: Gia đình tôi","lines":[["主持人","小王，你家有几口人？","Xiǎo Wáng, nǐ jiā yǒu jǐ kǒu rén?","Tiểu Vương, nhà bạn có mấy người?"],["小王","我家有五口人。","Wǒ jiā yǒu wǔ kǒu rén.","Nhà tôi có năm người."],["主持人","都有谁？","Dōu yǒu shéi?","Gồm những ai?"],["小王","爸爸、妈妈、两个姐姐和我。","Bàba, māma, liǎng gè jiějie hé wǒ.","Bố, mẹ, hai chị gái và tôi."],["主持人","你爸爸做什么工作？","Nǐ bàba zuò shénme gōngzuò?","Bố bạn làm nghề gì?"],["小王","我爸爸是医生，妈妈是老师。","Wǒ bàba shì yīshēng, māma shì lǎoshī.","Bố tôi là bác sĩ, mẹ tôi là giáo viên."]],"qs":[{"z":"小王有几个姐姐？","v":"Tiểu Vương có mấy chị gái?","o":["一个","两个","三个"],"a":1,"s":3},{"z":"小王的爸爸做什么工作？","v":"Bố Tiểu Vương làm nghề gì?","o":["老师","医生","学生"],"a":1,"s":5}]},{"id":"p1-04","l":1,"k":"podcast","t":"Podcast: Gọi món ở nhà hàng","lines":[["服务员","你好，你们想吃什么？","Nǐ hǎo, nǐmen xiǎng chī shénme?","Xin chào, các bạn muốn ăn gì?"],["客人","我想吃面条，他想吃米饭。","Wǒ xiǎng chī miàntiáo, tā xiǎng chī mǐfàn.","Tôi muốn ăn mì, anh ấy muốn ăn cơm."],["服务员","要喝什么？","Yào hē shénme?","Muốn uống gì?"],["客人","我要一杯茶，他要一杯水。","Wǒ yào yì bēi chá, tā yào yì bēi shuǐ.","Tôi lấy một cốc trà, anh ấy lấy một cốc nước."],["服务员","一共三十五块。","Yígòng sānshíwǔ kuài.","Tổng cộng ba mươi lăm đồng."],["客人","好的，谢谢！","Hǎo de, xièxie!","Được, cảm ơn!"]],"qs":[{"z":"他想吃什么？","v":"Anh ấy muốn ăn gì?","o":["面条","米饭","鱼"],"a":1,"s":1},{"z":"一共多少钱？","v":"Tổng cộng bao nhiêu tiền?","o":["二十五块","三十五块","四十五块"],"a":1,"s":4}]},{"id":"p1-05","l":1,"k":"podcast","t":"Podcast: Thời tiết hôm nay","lines":[["主持人","大家好！今天天气很好。","Dàjiā hǎo! Jīntiān tiānqì hěn hǎo.","Xin chào mọi người! Hôm nay thời tiết rất đẹp."],["主持人","太阳很大，不冷也不热。","Tàiyáng hěn dà, bù lěng yě bú rè.","Nắng lớn, không lạnh cũng không nóng."],["主持人","我们去公园玩吧！","Wǒmen qù gōngyuán wán ba!","Chúng ta đi công viên chơi đi!"],["主持人","明天会下雨，所以今天去最好。","Míngtiān huì xiàyǔ, suǒyǐ jīntiān qù zuì hǎo.","Ngày mai sẽ mưa, nên hôm nay đi là tốt nhất."],["主持人","下雨的时候，我喜欢在家看书。","Xiàyǔ de shíhou, wǒ xǐhuan zài jiā kànshū.","Lúc trời mưa, tôi thích ở nhà đọc sách."],["主持人","你喜欢什么天气？","Nǐ xǐhuan shénme tiānqì?","Bạn thích thời tiết thế nào?"]],"qs":[{"z":"今天天气怎么样？","v":"Hôm nay thời tiết thế nào?","o":["很好","下雨","很冷"],"a":0,"s":0},{"z":"明天天气怎么样？","v":"Ngày mai thời tiết thế nào?","o":["很热","会下雨","下雪"],"a":1,"s":3}]},{"id":"p1-06","l":1,"k":"podcast","t":"Podcast: Mua trái cây","lines":[["小王","老板，苹果多少钱一斤？","Lǎobǎn, píngguǒ duōshao qián yì jīn?","Ông chủ, táo bao nhiêu tiền một cân?"],["老板","五块一斤。","Wǔ kuài yì jīn.","Năm đồng một cân."],["小王","我买两斤。香蕉呢？","Wǒ mǎi liǎng jīn. Xiāngjiāo ne?","Tôi mua hai cân. Còn chuối thì sao?"],["老板","香蕉四块一斤。","Xiāngjiāo sì kuài yì jīn.","Chuối bốn đồng một cân."],["小王","好，我也要一斤香蕉。","Hǎo, wǒ yě yào yì jīn xiāngjiāo.","Được, tôi cũng lấy một cân chuối."],["老板","一共十四块。","Yígòng shísì kuài.","Tổng cộng mười bốn đồng."]],"qs":[{"z":"苹果多少钱一斤？","v":"Táo bao nhiêu tiền một cân?","o":["四块","五块","六块"],"a":1,"s":1},{"z":"一共多少钱？","v":"Tổng cộng bao nhiêu tiền?","o":["十四块","十五块","二十块"],"a":0,"s":5}]},{"id":"p1-07","l":1,"k":"podcast","t":"Podcast: Cuối tuần làm gì","lines":[["主持人","小李，周末你做什么？","Xiǎo Lǐ, zhōumò nǐ zuò shénme?","Tiểu Lý, cuối tuần bạn làm gì?"],["小李","我周六去学校学汉语。","Wǒ zhōuliù qù xuéxiào xué Hànyǔ.","Thứ Bảy tôi đến trường học tiếng Trung."],["主持人","周日呢？","Zhōu rì ne?","Còn Chủ Nhật thì sao?"],["小李","周日我和朋友去看电影。","Zhōu rì wǒ hé péngyou qù kàn diànyǐng.","Chủ Nhật tôi cùng bạn đi xem phim."],["主持人","你们看什么电影？","Nǐmen kàn shénme diànyǐng?","Các bạn xem phim gì?"],["小李","我们看一个中国电影。","Wǒmen kàn yí gè Zhōngguó diànyǐng.","Chúng tôi xem một bộ phim Trung Quốc."]],"qs":[{"z":"小李周六做什么？","v":"Thứ Bảy Tiểu Lý làm gì?","o":["去学校学汉语","看电影","去工作"],"a":0,"s":1},{"z":"周日他和谁去看电影？","v":"Chủ Nhật anh ấy cùng ai đi xem phim?","o":["老师","朋友","妈妈"],"a":1,"s":3}]},{"id":"p1-08","l":1,"k":"podcast","t":"Podcast: Bạn của tôi","lines":[["主持人","我有一个好朋友，她叫小红。","Wǒ yǒu yí gè hǎo péngyou, tā jiào Xiǎo Hóng.","Tôi có một người bạn tốt, cô ấy tên là Tiểu Hồng."],["主持人","她是我的同学，她很漂亮。","Tā shì wǒ de tóngxué, tā hěn piàoliang.","Cô ấy là bạn học của tôi, cô ấy rất xinh."],["主持人","她喜欢唱歌，也喜欢跳舞。","Tā xǐhuan chànggē, yě xǐhuan tiàowǔ.","Cô ấy thích hát, cũng thích nhảy múa."],["主持人","我们每天一起去学校。","Wǒmen měitiān yìqǐ qù xuéxiào.","Mỗi ngày chúng tôi cùng đến trường."],["主持人","她会说英语和汉语。","Tā huì shuō Yīngyǔ hé Hànyǔ.","Cô ấy biết nói tiếng Anh và tiếng Trung."],["主持人","我很喜欢我的朋友。","Wǒ hěn xǐhuan wǒ de péngyou.","Tôi rất quý bạn của mình."]],"qs":[{"z":"小红是说话人的什么人？","v":"Tiểu Hồng là gì của người nói?","o":["同学","老师","姐姐"],"a":0,"s":1},{"z":"小红喜欢做什么？","v":"Tiểu Hồng thích làm gì?","o":["唱歌和跳舞","看书","游泳"],"a":0,"s":2}]},{"id":"p1-09","l":1,"k":"podcast","t":"Podcast: Học tiếng Trung","lines":[["主持人","大家好！很多人问我：汉语难不难？","Dàjiā hǎo! Hěnduō rén wèn wǒ: Hànyǔ nán bù nán?","Xin chào mọi người! Nhiều người hỏi tôi: Tiếng Trung có khó không?"],["主持人","我觉得汉语不太难。","Wǒ juéde Hànyǔ bútài nán.","Tôi thấy tiếng Trung không quá khó."],["主持人","汉字有一点儿难，但是很有意思。","Hànzì yǒu yìdiǎnr nán, dànshì hěn yǒu yìsi.","Chữ Hán hơi khó một chút, nhưng rất thú vị."],["主持人","我每天学习一个小时。","Wǒ měitiān xuéxí yí gè xiǎoshí.","Mỗi ngày tôi học một tiếng."],["主持人","我听，我说，我读，我写。","Wǒ tīng, wǒ shuō, wǒ dú, wǒ xiě.","Tôi nghe, tôi nói, tôi đọc, tôi viết."],["主持人","慢慢来，你也可以学好汉语！","Mànmàn lái, nǐ yě kěyǐ xué hǎo Hànyǔ!","Từ từ thôi, bạn cũng có thể học giỏi tiếng Trung!"]],"qs":[{"z":"他觉得汉语怎么样？","v":"Anh ấy thấy tiếng Trung thế nào?","o":["不太难","太难了","没有意思"],"a":0,"s":1},{"z":"他每天学习多长时间？","v":"Mỗi ngày anh ấy học bao lâu?","o":["一个小时","两个小时","半个小时"],"a":0,"s":3}]},{"id":"p1-10","l":1,"k":"podcast","t":"Podcast: Hỏi đường","lines":[["小林","请问，学校在哪儿？","Qǐngwèn, xuéxiào zài nǎr?","Xin hỏi, trường học ở đâu?"],["路人","你一直往前走。","Nǐ yìzhí wǎng qián zǒu.","Bạn cứ đi thẳng về phía trước."],["小林","然后呢？","Ránhòu ne?","Sau đó thì sao?"],["路人","到红绿灯往左走，学校就在前面。","Dào hónglǜdēng wǎng zuǒ zǒu, xuéxiào jiù zài qiánmiàn.","Đến đèn giao thông rẽ trái, trường ở ngay phía trước."],["小林","远不远？","Yuǎn bù yuǎn?","Có xa không?"],["路人","不远，走五分钟就到了。","Bù yuǎn, zǒu wǔ fēnzhōng jiù dào le.","Không xa, đi bộ năm phút là đến."],["小林","谢谢！","Xièxie!","Cảm ơn!"],["路人","不客气。","Bú kèqi.","Không có gì."]],"qs":[{"z":"到红绿灯往哪儿走？","v":"Đến đèn giao thông thì rẽ hướng nào?","o":["左","右","后"],"a":0,"s":3},{"z":"走多长时间到学校？","v":"Đi bộ bao lâu thì đến trường?","o":["三分钟","五分钟","十分钟"],"a":1,"s":5}]},{"id":"p2-01","l":2,"k":"podcast","t":"Podcast: Sở thích của tôi","lines":[["主持人","欢迎来到我们的节目！小李，你有什么爱好？","Huānyíng lái dào wǒmen de jiémù! Xiǎo Lǐ, nǐ yǒu shénme àihào?","Chào mừng đến với chương trình của chúng ta! Tiểu Lý, bạn có sở thích gì?"],["小李","我喜欢运动，特别是游泳。","Wǒ xǐhuan yùndòng, tèbié shì yóuyǒng.","Tôi thích thể thao, đặc biệt là bơi lội."],["主持人","你每个星期游几次？","Nǐ měige xīngqī yóu jǐ cì?","Mỗi tuần bạn bơi mấy lần?"],["小李","我每个星期游三次，一次游一个小时。","Wǒ měige xīngqī yóu sān cì, yí cì yóu yí gè xiǎoshí.","Mỗi tuần tôi bơi ba lần, mỗi lần một tiếng."],["主持人","太棒了！除了游泳，你还喜欢做什么？","Tài bàng le! Chúle yóuyǒng, nǐ hái xǐhuan zuò shénme?","Tuyệt quá! Ngoài bơi lội ra, bạn còn thích làm gì?"],["小李","我还喜欢看电影，周末常常和朋友一起去。","Wǒ hái xǐhuan kàn diànyǐng, zhōumò chángcháng hé péngyou yìqǐ qù.","Tôi còn thích xem phim, cuối tuần thường đi cùng bạn bè."],["主持人","谢谢你，下次再聊！","Xièxie nǐ, xià cì zài liáo!","Cảm ơn bạn, lần sau lại trò chuyện nhé!"]],"qs":[{"z":"小李最喜欢什么运动？","v":"Tiểu Lý thích môn thể thao nào nhất?","o":["游泳","跑步","打篮球"],"a":0,"s":1},{"z":"他每个星期游几次？","v":"Mỗi tuần anh ấy bơi mấy lần?","o":["两次","三次","四次"],"a":1,"s":3}]},{"id":"p2-02","l":2,"k":"podcast","t":"Podcast: Chuyến du lịch Bắc Kinh","lines":[["主持人","大家好！下个月我要去北京旅行。","Dàjiā hǎo! Xià ge yuè wǒ yào qù Běijīng lǚxíng.","Xin chào mọi người! Tháng sau tôi sẽ đi du lịch Bắc Kinh."],["主持人","我准备坐飞机去，大概要三个小时。","Wǒ zhǔnbèi zuò fēijī qù, dàgài yào sān gè xiǎoshí.","Tôi định đi máy bay, khoảng ba tiếng."],["主持人","我想去长城，也想去故宫。","Wǒ xiǎng qù Chángchéng, yě xiǎng qù Gùgōng.","Tôi muốn đi Vạn Lý Trường Thành, cũng muốn đi Cố Cung."],["主持人","我听说北京的烤鸭很好吃，我一定要试试。","Wǒ tīngshuō Běijīng de kǎoyā hěn hǎochī, wǒ yídìng yào shì shì.","Nghe nói vịt quay Bắc Kinh rất ngon, tôi nhất định phải thử."],["主持人","我已经买了机票，也订好了宾馆。","Wǒ yǐjīng mǎi le jīpiào, yě dìng hǎo le bīnguǎn.","Tôi đã mua vé máy bay, cũng đã đặt xong khách sạn."],["主持人","我还要带上相机，拍很多照片。","Wǒ hái yào dài shàng xiàngjī, pāi hěnduō zhàopiàn.","Tôi còn mang theo máy ảnh để chụp thật nhiều ảnh."],["主持人","旅行回来以后，我再给大家讲讲。","Lǚxíng huílái yǐhòu, wǒ zài gěi dàjiā jiǎng jiǎng.","Sau khi đi du lịch về, tôi sẽ kể lại cho mọi người."]],"qs":[{"z":"他下个月要去哪儿？","v":"Tháng sau anh ấy đi đâu?","o":["上海","北京","广州"],"a":1,"s":0},{"z":"他怎么去？","v":"Anh ấy đi bằng gì?","o":["坐火车","坐飞机","开车"],"a":1,"s":1}]},{"id":"p2-03","l":2,"k":"podcast","t":"Podcast: Đi khám bệnh","lines":[["医生","你哪里不舒服？","Nǐ nǎlǐ bù shūfu?","Bạn thấy khó chịu ở đâu?"],["病人","我头疼，还有点儿发烧。","Wǒ tóuténg, hái yǒudiǎnr fāshāo.","Tôi đau đầu, lại hơi sốt nữa."],["医生","你咳嗽吗？","Nǐ késou ma?","Bạn có ho không?"],["病人","有一点儿，已经两天了。","Yǒu yìdiǎnr, yǐjīng liǎng tiān le.","Có một chút, đã hai ngày rồi."],["医生","你感冒了，要多喝水，好好休息。","Nǐ gǎnmào le, yào duō hē shuǐ, hǎo hǎo xiūxi.","Bạn bị cảm rồi, cần uống nhiều nước và nghỉ ngơi cho tốt."],["病人","我需要吃药吗？","Wǒ xūyào chīyào ma?","Tôi có cần uống thuốc không?"],["医生","要，一天吃三次，饭后吃。","Yào, yì tiān chī sān cì, fàn hòu chī.","Cần, một ngày uống ba lần, uống sau bữa ăn."]],"qs":[{"z":"病人哪里不舒服？","v":"Bệnh nhân khó chịu ở đâu?","o":["肚子疼","头疼","腿疼"],"a":1,"s":1},{"z":"药一天吃几次？","v":"Thuốc uống mấy lần một ngày?","o":["一次","两次","三次"],"a":2,"s":6}]},{"id":"p2-04","l":2,"k":"podcast","t":"Podcast: Đi siêu thị","lines":[["小红","我们先去买水果吧。","Wǒmen xiān qù mǎi shuǐguǒ ba.","Chúng ta đi mua trái cây trước nhé."],["小明","好。你想买什么？","Hǎo. Nǐ xiǎng mǎi shénme?","Được. Bạn muốn mua gì?"],["小红","我想买西瓜和橙子。","Wǒ xiǎng mǎi xīguā hé chéngzi.","Tôi muốn mua dưa hấu và cam."],["小明","西瓜太贵了，我们买一个小的吧。","Xīguā tài guì le, wǒmen mǎi yí gè xiǎo de ba.","Dưa hấu đắt quá, chúng ta mua một quả nhỏ thôi."],["小红","好，再买一些牛奶和面包。","Hǎo, zài mǎi yìxiē niúnǎi hé miànbāo.","Được, mua thêm một ít sữa và bánh mì."],["小明","牛奶在左边，面包在右边。","Niúnǎi zài zuǒbian, miànbāo zài yòubian.","Sữa ở bên trái, bánh mì ở bên phải."],["小红","太好了，买完了我们去结账。","Tài hǎo le, mǎi wán le wǒmen qù jiézhàng.","Tuyệt quá, mua xong chúng ta đi thanh toán."]],"qs":[{"z":"他们先去买什么？","v":"Họ đi mua gì trước?","o":["水果","牛奶","面包"],"a":0,"s":0},{"z":"西瓜怎么样？","v":"Dưa hấu thế nào?","o":["很便宜","太贵了","不新鲜"],"a":1,"s":3}]},{"id":"p2-05","l":2,"k":"podcast","t":"Podcast: Nhà mới của tôi","lines":[["主持人","上个月我搬了新家。","Shàng ge yuè wǒ bān le xīn jiā.","Tháng trước tôi chuyển sang nhà mới."],["主持人","新家在六楼，有两个卧室和一个客厅。","Xīn jiā zài liù lóu, yǒu liǎng gè wòshì hé yí gè kètīng.","Nhà mới ở tầng sáu, có hai phòng ngủ và một phòng khách."],["主持人","客厅很大，窗户也很大，阳光很好。","Kètīng hěn dà, chuānghu yě hěn dà, yángguāng hěn hǎo.","Phòng khách rất rộng, cửa sổ cũng lớn, ánh nắng rất đẹp."],["主持人","厨房不大，但是很干净。","Chúfáng bú dà, dànshì hěn gānjìng.","Nhà bếp không lớn nhưng rất sạch."],["主持人","我家附近有地铁站，上班很方便。","Wǒ jiā fùjìn yǒu dìtiě zhàn, shàngbān hěn fāngbiàn.","Gần nhà tôi có ga tàu điện ngầm, đi làm rất tiện."],["主持人","周末请你们来我家玩！","Zhōumò qǐng nǐmen lái wǒ jiā wán!","Cuối tuần mời các bạn đến nhà tôi chơi!"]],"qs":[{"z":"新家在几楼？","v":"Nhà mới ở tầng mấy?","o":["四楼","五楼","六楼"],"a":2,"s":1},{"z":"新家附近有什么？","v":"Gần nhà mới có gì?","o":["公园","地铁站","超市"],"a":1,"s":4}]},{"id":"p2-06","l":2,"k":"podcast","t":"Podcast: Tiệc sinh nhật","lines":[["小林","明天是我的生日，你能来参加聚会吗？","Míngtiān shì wǒ de shēngrì, nǐ néng lái cānjiā jùhuì ma?","Ngày mai là sinh nhật tôi, bạn có thể đến dự tiệc không?"],["小红","当然可以！几点开始？","Dāngrán kěyǐ! Jǐ diǎn kāishǐ?","Tất nhiên rồi! Mấy giờ bắt đầu?"],["小林","晚上六点，在我家。","Wǎnshang liù diǎn, zài wǒ jiā.","Sáu giờ tối, ở nhà tôi."],["小红","我应该带什么礼物？","Wǒ yīnggāi dài shénme lǐwù?","Tôi nên mang quà gì?"],["小林","不用带礼物，你来我就很高兴了。","Búyòng dài lǐwù, nǐ lái wǒ jiù hěn gāoxìng le.","Không cần mang quà đâu, bạn đến là tôi vui rồi."],["小红","那我带一个蛋糕吧。","Nà wǒ dài yí gè dàngāo ba.","Vậy tôi mang một cái bánh kem nhé."],["小林","太好了，谢谢你！","Tài hǎo le, xièxie nǐ!","Tuyệt quá, cảm ơn bạn!"]],"qs":[{"z":"聚会几点开始？","v":"Tiệc bắt đầu lúc mấy giờ?","o":["五点","六点","七点"],"a":1,"s":2},{"z":"小红带什么去？","v":"Tiểu Hồng mang gì đến?","o":["蛋糕","花","书"],"a":0,"s":5}]},{"id":"p2-07","l":2,"k":"podcast","t":"Podcast: Đi tàu điện ngầm đi làm","lines":[["主持人","我每天坐地铁上班。","Wǒ měitiān zuò dìtiě shàngbān.","Mỗi ngày tôi đi tàu điện ngầm đi làm."],["主持人","我家离公司很远，开车要一个小时，坐地铁只要四十分钟。","Wǒ jiā lí gōngsī hěn yuǎn, kāichē yào yí gè xiǎoshí, zuò dìtiě zhǐyào sìshí fēnzhōng.","Nhà tôi cách công ty rất xa, lái xe mất một tiếng, đi tàu điện ngầm chỉ cần bốn mươi phút."],["主持人","早上地铁里人很多，常常没有座位。","Zǎoshang dìtiě lǐ rén hěnduō, chángcháng méiyǒu zuòwèi.","Buổi sáng trong tàu rất đông người, thường không có chỗ ngồi."],["主持人","所以我一般站着听音乐，或者看新闻。","Suǒyǐ wǒ yìbān zhàn zhe tīng yīnyuè, huòzhě kàn xīnwén.","Vì vậy tôi thường đứng nghe nhạc hoặc xem tin tức."],["主持人","下班的时候也一样，人特别多。","Xiàbān de shíhou yě yíyàng, rén tèbié duō.","Lúc tan làm cũng vậy, người đặc biệt đông."],["主持人","不过地铁很方便，从来不堵车。","Búguò dìtiě hěn fāngbiàn, cónglái bù dǔchē.","Nhưng tàu điện ngầm rất tiện, chưa bao giờ bị tắc đường."],["主持人","我觉得坐地铁比开车好。","Wǒ juéde zuò dìtiě bǐ kāichē hǎo.","Tôi thấy đi tàu điện ngầm tốt hơn lái xe."]],"qs":[{"z":"坐地铁要多长时间？","v":"Đi tàu điện ngầm mất bao lâu?","o":["三十分钟","四十分钟","一个小时"],"a":1,"s":1},{"z":"他为什么觉得地铁好？","v":"Vì sao anh ấy thấy tàu điện ngầm tốt?","o":["很便宜","不堵车","有座位"],"a":1,"s":5}]},{"id":"p2-08","l":2,"k":"podcast","t":"Podcast: Cách học tiếng Trung","lines":[["主持人","很多同学问我，怎么学好汉语？","Hěnduō tóngxué wèn wǒ, zěnme xué hǎo Hànyǔ?","Nhiều bạn học hỏi tôi, làm sao để học giỏi tiếng Trung?"],["主持人","第一，每天听一点儿，说一点儿。","Dì yī, měitiān tīng yìdiǎnr, shuō yìdiǎnr.","Thứ nhất, mỗi ngày nghe một chút, nói một chút."],["主持人","第二，多看中文电影，多听中文歌。","Dì èr, duō kàn Zhōngwén diànyǐng, duō tīng Zhōngwén gē.","Thứ hai, xem nhiều phim tiếng Trung, nghe nhiều bài hát tiếng Trung."],["主持人","第三，不要怕说错，错了没关系。","Dì sān, búyào pà shuō cuò, cuò le méi guānxi.","Thứ ba, đừng sợ nói sai, sai cũng không sao."],["主持人","第四，把新学的词写在本子上，常常复习。","Dì sì, bǎ xīn xué de cí xiě zài běnzi shàng, chángcháng fùxí.","Thứ tư, ghi từ mới học vào vở và thường xuyên ôn tập."],["主持人","只要每天努力，你一定会进步。","Zhǐyào měitiān nǔlì, nǐ yídìng huì jìnbù.","Chỉ cần mỗi ngày cố gắng, bạn nhất định sẽ tiến bộ."]],"qs":[{"z":"第一个方法是什么？","v":"Cách thứ nhất là gì?","o":["每天听和说","每天写字","每天看书"],"a":0,"s":1},{"z":"说错了怎么样？","v":"Nói sai thì thế nào?","o":["没关系","很麻烦","不能原谅"],"a":0,"s":3}]},{"id":"p2-09","l":2,"k":"podcast","t":"Podcast: Hẹn bạn đi leo núi","lines":[["小明","喂，小红，你在哪儿呢？","Wèi, Xiǎo Hóng, nǐ zài nǎr ne?","A lô, Tiểu Hồng, bạn đang ở đâu thế?"],["小红","我在回家的路上，怎么了？","Wǒ zài huíjiā de lù shàng, zěnme le?","Tôi đang trên đường về nhà, có chuyện gì thế?"],["小明","明天下午有空吗？我们去爬山吧。","Míngtiān xiàwǔ yǒu kōng ma? Wǒmen qù páshān ba.","Chiều mai bạn rảnh không? Chúng ta đi leo núi nhé."],["小红","明天可能会下雨，听说要下大雨。","Míngtiān kěnéng huì xiàyǔ, tīngshuō yào xià dà yǔ.","Ngày mai có thể mưa, nghe nói sẽ có mưa lớn."],["小明","是吗？那我们改天去吧。","Shì ma? Nà wǒmen gǎi tiān qù ba.","Vậy à? Thế chúng ta đổi hôm khác đi."],["小红","好的。后天怎么样？","Hǎo de. Hòutiān zěnmeyàng?","Được. Ngày kia thì sao?"],["小明","后天可以，我们早上八点见。","Hòutiān kěyǐ, wǒmen zǎoshang bā diǎn jiàn.","Ngày kia được, tám giờ sáng chúng ta gặp nhau."]],"qs":[{"z":"他们想去做什么？","v":"Họ muốn đi làm gì?","o":["爬山","看电影","买东西"],"a":0,"s":2},{"z":"他们什么时候见面？","v":"Khi nào họ gặp nhau?","o":["明天下午","后天早上八点","后天晚上"],"a":1,"s":6}]},{"id":"p2-10","l":2,"k":"podcast","t":"Podcast: Thành phố của tôi","lines":[["主持人","我住在一个南方城市，那里的春天很舒服。","Wǒ zhù zài yí gè nánfāng chéngshì, nàlǐ de chūntiān hěn shūfu.","Tôi sống ở một thành phố miền Nam, mùa xuân ở đó rất dễ chịu."],["主持人","三月的天气不冷也不热，花都开了。","Sānyuè de tiānqì bù lěng yě bú rè, huā dōu kāi le.","Thời tiết tháng ba không lạnh cũng không nóng, hoa đã nở hết."],["主持人","夏天很热，常常下大雨。","Xiàtiān hěn rè, chángcháng xià dà yǔ.","Mùa hè rất nóng, thường mưa to."],["主持人","秋天是最好的季节，天气凉快，天空很蓝。","Qiūtiān shì zuì hǎo de jìjié, tiānqì liángkuai, tiānkōng hěn lán.","Mùa thu là mùa đẹp nhất, thời tiết mát mẻ, bầu trời rất xanh."],["主持人","冬天不太冷，很少下雪。","Dōngtiān bútài lěng, hěn shǎo xiàxuě.","Mùa đông không quá lạnh, hiếm khi có tuyết."],["主持人","其实，我一年四季都喜欢这个城市。","Qíshí, wǒ yì nián sìjì dōu xǐhuan zhège chéngshì.","Thật ra, bốn mùa trong năm tôi đều yêu thành phố này."],["主持人","欢迎你们来玩！","Huānyíng nǐ men lái wán!","Chào mừng các bạn đến chơi!"]],"qs":[{"z":"说话人觉得哪个季节最好？","v":"Người nói thấy mùa nào đẹp nhất?","o":["春天","夏天","秋天"],"a":2,"s":3},{"z":"夏天怎么样？","v":"Mùa hè thế nào?","o":["很冷","很热，常下雨","下雪"],"a":1,"s":2}]},{"id":"p3-01","l":3,"k":"podcast","t":"Podcast: Bí quyết kiên trì vận động","lines":[["主持人","大家好，今天我想和大家聊聊怎么坚持运动。","Dàjiā hǎo, jīntiān wǒ xiǎng hé dàjiā liáo liáo zěnme jiānchí yùndòng.","Xin chào mọi người, hôm nay tôi muốn trò chuyện về cách kiên trì vận động."],["主持人","很多人下了决心，但是过几天就放弃了。","Hěnduō rén xià le juéxīn, dànshì guò jǐ tiān jiù fàngqì le.","Nhiều người đã quyết tâm nhưng vài ngày sau lại bỏ cuộc."],["主持人","其实，关键不是一次运动多长时间，而是养成习惯。","Qíshí, guānjiàn bú shì yí cì yùndòng duō cháng shíjiān, ér shì yǎngchéng xíguàn.","Thực ra, mấu chốt không phải là mỗi lần vận động bao lâu mà là hình thành thói quen."],["主持人","我的方法是：每天早上起床以后，先做二十分钟运动。","Wǒ de fāngfǎ shì: měitiān zǎoshang qǐchuáng yǐhòu, xiān zuò èrshí fēnzhōng yùndòng.","Cách của tôi là: mỗi sáng sau khi ngủ dậy, tập trước hai mươi phút."],["主持人","刚开始不要太累，只要动起来就可以。","Gāng kāishǐ búyào tài lèi, zhǐyào dòng qǐlái jiù kěyǐ.","Lúc mới bắt đầu đừng quá mệt, chỉ cần động lên là được."],["主持人","你还可以找一个朋友，互相鼓励，这样更容易坚持。","Nǐ hái kěyǐ zhǎo yí gè péngyou, hùxiāng gǔlì, zhè yàng gèng róngyì jiānchí.","Bạn cũng có thể tìm một người bạn để động viên lẫn nhau, như vậy dễ kiên trì hơn."],["主持人","另外，给自己一些小奖励，比如买一件喜欢的运动服。","Lìngwài, gěi zìjǐ yìxiē xiǎo jiǎnglì, bǐrú mǎi yí jiàn xǐhuan de yùndòngfú.","Ngoài ra, hãy tự thưởng cho mình một chút, ví dụ mua một bộ đồ thể thao mình thích."],["主持人","只要坚持一个月，你就会发现身体变好了，心情也变好了。","Zhǐyào jiānchí yí gè yuè, nǐ jiù huì fāxiàn shēntǐ biàn hǎo le, xīnqíng yě biàn hǎo le.","Chỉ cần kiên trì một tháng, bạn sẽ thấy cơ thể tốt lên, tâm trạng cũng tốt lên."]],"qs":[{"z":"说话人觉得坚持运动的关键是什么？","v":"Người nói cho rằng mấu chốt của việc kiên trì vận động là gì?","o":["一次运动很长时间","养成习惯","买贵的衣服"],"a":1,"s":2},{"z":"他建议早上起床以后做什么？","v":"Anh ấy khuyên làm gì sau khi dậy buổi sáng?","o":["运动二十分钟","跑步一个小时","再睡一会儿"],"a":0,"s":3}]},{"id":"p3-02","l":3,"k":"podcast","t":"Podcast: Kinh nghiệm thuê nhà","lines":[["主持人","小张，你刚搬来这个城市，租房顺利吗？","Xiǎo Zhāng, nǐ gāng bān lái zhège chéngshì, zūfáng shùnlì ma?","Tiểu Trương, bạn mới chuyển đến thành phố này, thuê nhà có thuận lợi không?"],["小张","一开始不太顺利，我看了十多套房子。","Yì kāishǐ bútài shùnlì, wǒ kàn le shí duō tào fángzi.","Lúc đầu không thuận lợi lắm, tôi đã xem hơn mười căn."],["主持人","你最看重什么？","Nǐ zuì kàn zhòng shénme?","Bạn coi trọng điều gì nhất?"],["小张","首先是交通，离地铁站最好不要超过十分钟。","Shǒuxiān shì jiāotōng, lí dìtiě zhàn zuì hǎo búyào chāoguò shífēn zhōng.","Trước hết là giao thông, tốt nhất cách ga tàu điện ngầm không quá mười phút."],["主持人","还有呢？","Hái yǒu ne?","Còn gì nữa?"],["小张","房租也很重要，我的工资不高，所以要便宜一点儿。","Fángzū yě hěn zhòngyào, wǒ de gōngzī bù gāo, suǒyǐ yào piányi yìdiǎnr.","Tiền thuê cũng rất quan trọng, lương tôi không cao nên cần rẻ một chút."],["主持人","签合同的时候要注意什么？","Qiān hétong de shíhou yào zhùyì shénme?","Khi ký hợp đồng cần chú ý điều gì?"],["小张","一定要看清楚押金和租期，别急着签字。","Yídìng yào kàn qīngchu yājīn hé zūqī, bié jí zhe qiānzì.","Nhất định phải xem kỹ tiền cọc và thời hạn thuê, đừng vội ký."]],"qs":[{"z":"小张看了多少套房子？","v":"Tiểu Trương đã xem bao nhiêu căn nhà?","o":["五套","十多套","二十套"],"a":1,"s":1},{"z":"签合同的时候要注意什么？","v":"Khi ký hợp đồng cần chú ý gì?","o":["押金和租期","房子的颜色","邻居是谁"],"a":0,"s":7}]},{"id":"p3-03","l":3,"k":"podcast","t":"Podcast: Chuyến du lịch nước ngoài đầu tiên","lines":[["主持人","去年夏天，我第一次出国旅行，去了日本。","Qùnián xiàtiān, wǒ dì-yī cì chūguó lǚxíng, qù le Rìběn.","Mùa hè năm ngoái, lần đầu tiên tôi đi du lịch nước ngoài, đến Nhật Bản."],["主持人","出发以前，我很紧张，因为我不会说日语。","Chūfā yǐqián, wǒ hěn jǐnzhāng, yīnwèi wǒ bú huì shuō Rìyǔ.","Trước khi đi, tôi rất lo lắng vì không biết nói tiếng Nhật."],["主持人","到了机场，我发现很多地方都有英文和汉字，大概能看懂。","Dào le jīchǎng, wǒ fāxiàn hěnduō dìfang dōu yǒu Yīngwén hé Hànzì, dàgài néng kàn dǒng.","Đến sân bay, tôi thấy nhiều nơi có cả tiếng Anh và chữ Hán, đại khái có thể hiểu."],["主持人","在饭馆点菜的时候，我指着菜单，服务员都很热情。","Zài fànguǎn diǎncài de shíhou, wǒ zhǐ zhe càidān, fúwùyuán dōu hěn rèqíng.","Khi gọi món ở nhà hàng, tôi chỉ vào thực đơn, nhân viên đều rất nhiệt tình."],["主持人","有一次我迷路了，一位老奶奶带我走了十分钟，一直送我到车站。","Yǒu yí cì wǒ mílù le, yí wèi lǎo nǎinai dài wǒ zǒu le shífēn zhōng, yìzhí sòng wǒ dào chēzhàn.","Có lần tôi bị lạc, một bà cụ dẫn tôi đi mười phút, đưa tận đến ga."],["主持人","这件事让我很感动。","Zhè jiàn shì ràng wǒ hěn gǎndòng.","Chuyện này khiến tôi rất cảm động."],["主持人","这次旅行让我明白，语言不是最大的问题，善良更重要。","Zhècì lǚxíng ràng wǒ míngbai, yǔyán bú shì zuì dà de wèntí, shànliáng gèng zhòngyào.","Chuyến đi này giúp tôi hiểu rằng ngôn ngữ không phải vấn đề lớn nhất, lòng tốt quan trọng hơn."],["主持人","回国以后，我开始学日语，打算明年再去一次。","Huíguó yǐhòu, wǒ kāishǐ xué Rìyǔ, dǎsuàn míngnián zài qù yí cì.","Về nước rồi, tôi bắt đầu học tiếng Nhật, dự định sang năm đi thêm một lần nữa."]],"qs":[{"z":"他去了哪个国家？","v":"Anh ấy đã đến nước nào?","o":["韩国","日本","泰国"],"a":1,"s":0},{"z":"谁送他到车站？","v":"Ai đưa anh ấy đến ga?","o":["服务员","一位老奶奶","警察"],"a":1,"s":4}]},{"id":"p3-04","l":3,"k":"podcast","t":"Podcast: Nâng cao khả năng nói tiếng Trung","lines":[["主持人","王老师，很多学生说自己看得懂，但是不敢开口。怎么办？","Wáng lǎoshī, hěnduō xuésheng shuō zìjǐ kàn de dǒng, dànshì bù gǎn kāi kǒu. Zěnme bàn?","Thầy Vương, nhiều học sinh nói mình đọc hiểu nhưng không dám mở miệng. Làm sao đây?"],["王老师","最重要的是要多说，不要怕犯错误。","Zuì zhòngyào de shì yào duō shuō, búyào pà fàn cuòwù.","Quan trọng nhất là nói nhiều, đừng sợ mắc lỗi."],["主持人","可是在国外，没有机会说汉语怎么办？","Kěshì zài guówài, méiyǒu jīhuì shuō Hànyǔ zěnme bàn?","Nhưng ở nước ngoài không có cơ hội nói tiếng Trung thì sao?"],["王老师","现在有很多办法，比如在网上找语言伙伴，或者看视频跟着读。","Xiànzài yǒu hěnduō bànfǎ, bǐrú zài wǎngshàng zhǎo yǔyán huǒbàn, huòzhě kàn shìpín gēn zhe dú.","Bây giờ có nhiều cách, ví dụ tìm bạn học ngôn ngữ trên mạng hoặc xem video đọc theo."],["主持人","跟着读真的有用吗？","Gēn zhe dú zhēn de yǒu yòng ma?","Đọc theo thật sự có ích không?"],["王老师","有用。你可以先听一句，再模仿他的发音和语调。","Yǒu yòng. Nǐ kěyǐ xiān tīng yí jù, zài mófǎng tā de fāyīn hé yǔdiào.","Có ích. Bạn có thể nghe một câu rồi bắt chước phát âm và ngữ điệu của họ."],["主持人","每天练习多长时间比较合适？","Měitiān liànxí duō cháng shíjiān bǐjiào héshì?","Mỗi ngày luyện tập bao lâu thì phù hợp?"],["王老师","不用太长，每天二十分钟，但是要坚持。","Búyòng tài cháng, měitiān èrshí fēnzhōng, dànshì yào jiānchí.","Không cần quá dài, mỗi ngày hai mươi phút nhưng phải kiên trì."]],"qs":[{"z":"王老师认为最重要的是什么？","v":"Thầy Vương cho rằng điều quan trọng nhất là gì?","o":["多说","多写","多看"],"a":0,"s":1},{"z":"每天练习多长时间比较合适？","v":"Mỗi ngày luyện tập bao lâu là hợp lý?","o":["二十分钟","两个小时","五分钟"],"a":0,"s":7}]},{"id":"p3-05","l":3,"k":"podcast","t":"Podcast: Mua sắm trực tuyến: lợi và hại","lines":[["主持人","现在越来越多的人喜欢网上购物。","Xiànzài yuèláiyuè duō de rén xǐhuan wǎngshàng gòuwù.","Ngày nay ngày càng nhiều người thích mua sắm trực tuyến."],["主持人","它最大的好处是方便，坐在家里就能买到东西。","Tā zuì dà de hǎochu shì fāngbiàn, zuò zài jiā lǐ jiù néng mǎi dào dōngxi.","Lợi ích lớn nhất là tiện lợi, ngồi ở nhà là mua được đồ."],["主持人","价格也比商店便宜，还经常有打折活动。","Jiàgé yě bǐ shāngdiàn piányi, hái jīngcháng yǒu dǎzhé huódòng.","Giá cũng rẻ hơn cửa hàng, lại thường có khuyến mãi giảm giá."],["主持人","而且，快递很快，有时候第二天就到了。","Érqiě, kuàidì hěn kuài, yǒu shíhou dì èr tiān jiù dào le.","Hơn nữa giao hàng nhanh, có khi hôm sau đã tới."],["主持人","不过，网购也有坏处。","Búguò, wǎnggòu yě yǒu huàichu.","Tuy nhiên mua sắm trực tuyến cũng có mặt hại."],["主持人","比如，你看不到真的东西，有时候质量不好，颜色也和照片不一样。","Bǐrú, nǐ kàn búdào zhēn de dōngxi, yǒu shíhou zhìliàng bù hǎo, yánsè yě hé zhàopiàn bù yíyàng.","Ví dụ bạn không nhìn thấy hàng thật, đôi khi chất lượng không tốt, màu sắc cũng khác ảnh."],["主持人","所以买东西以前，最好先看看别人的评价。","Suǒyǐ mǎi dōngxi yǐqián, zuì hǎo xiān kàn kàn biérén de píngjià.","Vì vậy trước khi mua, tốt nhất hãy xem đánh giá của người khác."],["主持人","如果不满意，要及时退货。","Rúguǒ bù mǎnyì, yào jíshí tuìhuò.","Nếu không hài lòng thì phải trả hàng kịp thời."]],"qs":[{"z":"网购最大的好处是什么？","v":"Lợi ích lớn nhất của mua sắm trực tuyến là gì?","o":["方便","质量好","颜色多"],"a":0,"s":1},{"z":"买东西以前最好做什么？","v":"Trước khi mua nên làm gì?","o":["看别人的评价","去商店试","问朋友借钱"],"a":0,"s":6}]},{"id":"p3-06","l":3,"k":"podcast","t":"Podcast: Phong tục Tết Nguyên đán","lines":[["主持人","春节是中国最重要的传统节日。","Chūnjié shì Zhōngguó zuì zhòngyào de chuántǒng jiérì.","Tết Nguyên đán là ngày lễ truyền thống quan trọng nhất của Trung Quốc."],["主持人","春节前，人们要打扫房子，贴对联，买新衣服。","Chūnjié qián, rénmen yào dǎsǎo fángzi, tiē duìlián, mǎi xīn yīfu.","Trước Tết, mọi người dọn nhà, dán câu đối, mua quần áo mới."],["主持人","除夕晚上，一家人坐在一起吃年夜饭，北方人喜欢吃饺子。","Chúxī wǎnshang, yì jiā rén zuò zài yìqǐ chī niányèfàn, běifāng rén xǐhuan chī jiǎozi.","Tối giao thừa, cả nhà ngồi cùng nhau ăn bữa cơm tất niên, người miền Bắc thích ăn sủi cảo."],["主持人","饭后，大家一边看电视，一边聊天，等着新年到来。","Fàn hòu, dàjiā yìbiān kàn diànshì, yìbiān liáotiān, děng zhe xīnnián dào lái.","Sau bữa ăn, mọi người vừa xem tivi vừa trò chuyện, chờ năm mới đến."],["主持人","孩子们最喜欢的是红包，里面有爸爸妈妈给的压岁钱。","Háizimen zuì xǐhuan de shì hóngbāo, lǐmiàn yǒu bàba māma gěi de yāsuìqián.","Điều bọn trẻ thích nhất là bao lì xì, bên trong có tiền mừng tuổi bố mẹ cho."],["主持人","正月初一，人们互相拜年，说新年快乐。","Zhēngyuè chūyī, rénmen hùxiāng bàinián, shuō xīnnián kuàilè.","Mùng một Tết, mọi người chúc Tết nhau, nói chúc mừng năm mới."],["主持人","这时候，街上到处是鞭炮和灯笼，非常热闹。","Zhè shíhou, jiē shàng dàochù shì biānpào hé dēnglong, fēicháng rènao.","Lúc này đường phố đâu đâu cũng có pháo và đèn lồng, vô cùng náo nhiệt."],["主持人","春节不仅是一个节日，也是一家人团圆的日子。","Chūnjié bùjǐn shì yí gè jiérì, yě shì yì jiā rén tuányuán de rìzi.","Tết không chỉ là một ngày lễ mà còn là ngày cả gia đình đoàn tụ."]],"qs":[{"z":"除夕晚上一家人做什么？","v":"Tối giao thừa cả nhà làm gì?","o":["吃年夜饭","去旅行","看电影"],"a":0,"s":2},{"z":"孩子们最喜欢什么？","v":"Bọn trẻ thích gì nhất?","o":["鞭炮","红包","灯笼"],"a":1,"s":4}]},{"id":"p3-07","l":3,"k":"podcast","t":"Podcast: Chuẩn bị phỏng vấn xin việc","lines":[["面试官","请先做一个简单的自我介绍。","Qǐng xiān zuò yí gè jiǎndān de zìwǒ jièshào.","Xin hãy tự giới thiệu ngắn gọn trước."],["小刘","好的。我叫刘明，毕业于北京大学，学的是经济。","Hǎo de. Wǒ jiào Liú Míng, bìyè yú Běijīng Dàxué, xué de shì jīngjì.","Vâng. Tôi tên Lưu Minh, tốt nghiệp Đại học Bắc Kinh, học kinh tế."],["面试官","你为什么想来我们公司工作？","Nǐ wèishénme xiǎng lái wǒmen gōngsī gōngzuò?","Vì sao bạn muốn đến công ty chúng tôi làm việc?"],["小刘","因为贵公司在这个行业很有名，我希望在这里学到更多经验。","Yīnwèi guì gōngsī zài zhège hángyè hěn yǒumíng, wǒ xīwàng zài zhèlǐ xué dào gèng duō jīngyàn.","Vì quý công ty rất nổi tiếng trong ngành này, tôi hy vọng học hỏi thêm nhiều kinh nghiệm ở đây."],["面试官","你觉得自己有什么优点？","Nǐ juéde zìjǐ yǒu shénme yōudiǎn?","Bạn thấy mình có ưu điểm gì?"],["小刘","我做事认真，也很善于和别人合作。","Wǒ zuò shì rènzhēn, yě hěn shànyú hé biérén hézuò.","Tôi làm việc nghiêm túc, cũng rất giỏi hợp tác với người khác."],["面试官","那你的缺点呢？","Nà nǐ de quēdiǎn ne?","Còn nhược điểm của bạn thì sao?"],["小刘","有时候我太着急，但是我正在学习慢下来，把事情想清楚。","Yǒu shíhou wǒ tài zháojí, dànshì wǒ zhèngzài xuéxí màn xià lái, bǎ shìqing xiǎng qīngchu.","Đôi khi tôi quá nóng vội, nhưng tôi đang học cách chậm lại và suy nghĩ kỹ mọi việc."]],"qs":[{"z":"小刘学的是什么专业？","v":"Tiểu Lưu học chuyên ngành gì?","o":["经济","法律","医学"],"a":0,"s":1},{"z":"他说自己的缺点是什么？","v":"Anh ấy nói nhược điểm của mình là gì?","o":["太着急","太懒","太安静"],"a":0,"s":7}]},{"id":"p3-08","l":3,"k":"podcast","t":"Podcast: Bảo vệ môi trường","lines":[["主持人","保护环境不是一句口号，而是每个人都可以做的小事。","Bǎohù huánjìng bú shì yí jù kǒu hào, ér shì měige rén dōu kěyǐ zuò de xiǎo shì.","Bảo vệ môi trường không phải khẩu hiệu mà là những việc nhỏ ai cũng làm được."],["主持人","比如，出门时自己带购物袋，少用塑料袋。","Bǐrú, chūmén shí zìjǐ dài gòuwù dài, shǎo yòng sùliào dài.","Ví dụ, khi ra ngoài tự mang túi đi chợ, dùng ít túi nhựa."],["主持人","喝水的时候，用杯子，不要总是买瓶装水。","Hē shuǐ de shíhou, yòng bēizi, búyào zǒngshì mǎi píng zhuāng shuǐ.","Khi uống nước hãy dùng cốc, đừng lúc nào cũng mua nước đóng chai."],["主持人","短距离尽量走路或者骑自行车，这样既健康又环保。","Duǎn jùlí jǐnliàng zǒulù huòzhě qí zìxíngchē, zhè yàng jì jiànkāng yòu huánbǎo.","Quãng đường ngắn cố gắng đi bộ hoặc đạp xe, như vậy vừa khỏe vừa thân thiện môi trường."],["主持人","家里的垃圾要分类，能回收的东西不要随便扔掉。","Jiā lǐ de lājī yào fēn lèi, néng huíshōu de dōngxi búyào suíbiàn rēngdiào.","Rác trong nhà cần phân loại, đồ có thể tái chế đừng vứt bừa."],["主持人","另外，离开房间的时候别忘了关灯。","Lìngwài, líkāi fángjiān de shíhou bié wàng le guān dēng.","Ngoài ra, khi rời phòng đừng quên tắt đèn."],["主持人","如果每个人都从小事做起，我们的城市会越来越干净。","Rúguǒ měige rén dōu cóng xiǎo shì zuò qǐ, wǒmen de chéngshì huì yuèláiyuè gānjìng.","Nếu ai cũng bắt đầu từ việc nhỏ, thành phố của chúng ta sẽ ngày càng sạch."],["主持人","地球只有一个，我们要好好保护它。","Dìqiú zhǐyǒu yí gè, wǒmen yào hǎo hǎo bǎohù tā.","Trái đất chỉ có một, chúng ta phải bảo vệ nó thật tốt."]],"qs":[{"z":"出门时应该带什么？","v":"Khi ra ngoài nên mang theo gì?","o":["购物袋","雨伞","相机"],"a":0,"s":1},{"z":"离开房间时应该做什么？","v":"Khi rời khỏi phòng nên làm gì?","o":["关灯","开窗","开空调"],"a":0,"s":5}]},{"id":"p3-09","l":3,"k":"podcast","t":"Podcast: Quản lý thời gian","lines":[["主持人","小林，你每天事情那么多，是怎么安排时间的？","Xiǎo Lín, nǐ měitiān shìqing nàme duō, shì zěnme ānpái shíjiān de?","Tiểu Lâm, mỗi ngày bạn nhiều việc như vậy, bạn sắp xếp thời gian thế nào?"],["小林","我习惯前一天晚上先写好第二天的计划。","Wǒ xíguàn qián yì tiān wǎnshang xiān xiě hǎo dì èr tiān de jìhuà.","Tôi quen viết xong kế hoạch ngày hôm sau vào tối hôm trước."],["主持人","计划里都有什么？","Jìhuà lǐ dōu yǒu shénme?","Trong kế hoạch có những gì?"],["小林","最重要的三件事放在最前面，早上精神好的时候先完成。","Zuì zhòngyào de sān jiàn shì fàng zài zuì qiánmiàn, zǎoshang jīngshén hǎo de shíhou xiān wánchéng.","Ba việc quan trọng nhất đặt lên đầu, hoàn thành trước vào buổi sáng khi tinh thần tốt."],["主持人","那遇到突然的事情怎么办？","Nà yùdào tūrán de shìqing zěnme bàn?","Thế gặp việc đột xuất thì sao?"],["小林","我会留出一点儿时间，万一有变化，也不会太紧张。","Wǒ huì liú chū yìdiǎnr shíjiān, wànyī yǒu biànhuà, yě bú huì tài jǐnzhāng.","Tôi chừa ra một ít thời gian, lỡ có thay đổi cũng không quá căng thẳng."],["主持人","你有什么建议给听众吗？","Nǐ yǒu shénme jiànyì gěi tīngzhòng ma?","Bạn có lời khuyên nào cho thính giả không?"],["小林","别想一次做很多事，一次只做一件，效率反而更高。","Bié xiǎng yí cì zuò hěnduō shì, yí cì zhǐ zuò yí jiàn, xiàolǜ fǎn'ér gèng gāo.","Đừng nghĩ làm nhiều việc cùng lúc, mỗi lần chỉ làm một việc thì hiệu quả lại cao hơn."]],"qs":[{"z":"小林什么时候写计划？","v":"Tiểu Lâm viết kế hoạch lúc nào?","o":["前一天晚上","早上起床后","周末"],"a":0,"s":1},{"z":"他建议怎么做事？","v":"Anh ấy khuyên làm việc thế nào?","o":["同时做很多事","一次只做一件","下班以后再做"],"a":1,"s":7}]},{"id":"p3-10","l":3,"k":"podcast","t":"Podcast: Chung sống với hàng xóm","lines":[["主持人","我刚搬进这个小区的时候，一个人也不认识。","Wǒ gāng bān jìn zhège xiǎoqū de shíhou, yí gè rén yě bú rènshi.","Khi mới chuyển vào khu dân cư này, tôi không quen ai cả."],["主持人","有一天，隔壁的邻居给我送来了一盘饺子，还告诉我附近哪家超市最便宜。","Yǒu yì tiān, gébì de línjū gěi wǒ sòng lái le yì pán jiǎozi, hái gàosu wǒ fùjìn nǎ jiā chāoshì zuì piányi.","Một hôm, người hàng xóm bên cạnh mang cho tôi một đĩa sủi cảo, còn bảo tôi siêu thị nào gần đây rẻ nhất."],["主持人","我很感动，第二天也送了他一些水果。","Wǒ hěn gǎndòng, dì èr tiān yě sòng le tā yìxiē shuǐguǒ.","Tôi rất cảm động, hôm sau cũng tặng anh ấy ít trái cây."],["主持人","后来，我们成了好朋友，常常互相帮忙。","Hòu lái, wǒmen chéng le hǎo péngyou, chángcháng hùxiāng bāngmáng.","Về sau chúng tôi trở thành bạn tốt, thường giúp đỡ lẫn nhau."],["主持人","他出差的时候，我帮他照顾花；我生病的时候，他帮我买药。","Tā chūchāi de shíhou, wǒ bāng tā zhàogù huā; wǒ shēngbìng de shíhou, tā bāng wǒ mǎi yào.","Khi anh ấy đi công tác, tôi chăm hoa giúp; khi tôi ốm, anh ấy mua thuốc giúp."],["主持人","我觉得，和邻居相处的关键是真诚和尊重。","Wǒ juéde, hé línjū xiāngchǔ de guānjiàn shì zhēnchéng hé zūnzhòng.","Tôi nghĩ mấu chốt khi sống cùng hàng xóm là chân thành và tôn trọng."],["主持人","比如晚上不要太吵，垃圾要放到固定的地方。","Bǐrú wǎnshang búyào tài chǎo, lājī yào fàng dào gùdìng de dìfang.","Ví dụ buổi tối đừng quá ồn, rác phải để ở nơi quy định."],["主持人","好邻居，比远方的亲戚还重要。","Hǎo línjū, bǐ yuǎn fāng de qīnqi hái zhòngyào.","Hàng xóm tốt còn quan trọng hơn họ hàng ở xa."]],"qs":[{"z":"邻居送给他什么？","v":"Người hàng xóm tặng anh ấy gì?","o":["饺子","水果","花"],"a":0,"s":1},{"z":"他觉得相处的关键是什么？","v":"Anh ấy nghĩ mấu chốt khi chung sống là gì?","o":["真诚和尊重","送很多礼物","不说话"],"a":0,"s":5}]},{"id":"p4-01","l":4,"k":"podcast","t":"Podcast: Kỹ năng giao tiếp nơi công sở","lines":[["主持人","李经理，您觉得职场沟通中最容易犯的错误是什么？","Lǐ jīnglǐ, nín juéde zhíchǎng gōutōng zhōng zuì róngyì fàn de cuòwù shì shénme?","Giám đốc Lý, theo ông sai lầm dễ mắc nhất trong giao tiếp công sở là gì?"],["李经理","我觉得是只顾着表达自己，不愿意认真听别人说话。","Wǒ juéde shì zhǐgù zhe biǎodá zìjǐ, bú yuànyì rènzhēn tīng biérén shuōhuà.","Tôi nghĩ là chỉ mải bày tỏ bản thân mà không chịu nghiêm túc nghe người khác nói."],["主持人","那应该怎么改进呢？","Nà yīnggāi zěnme gǎijìn ne?","Vậy nên cải thiện thế nào?"],["李经理","首先要学会倾听，让对方把话说完，再发表自己的看法。","Shǒuxiān yào xuéhuì qīngtīng, ràng duìfāng bǎ huà shuō wán, zài fābiǎo zìjǐ de kànfǎ.","Trước hết phải học cách lắng nghe, để đối phương nói hết rồi mới nêu quan điểm của mình."],["主持人","如果遇到意见不一致的情况呢？","Rúguǒ yùdào yìjiàn bù yízhì de qíngkuàng ne?","Nếu gặp tình huống bất đồng ý kiến thì sao?"],["李经理","不要急着反驳，先肯定对方合理的部分，然后再提出不同的想法。","Búyào jí zhe fǎnbó, xiān kěndìng duìfāng hélǐ de bùfen, ránhòu zài tíchū bùtóng de xiǎngfǎ.","Đừng vội phản bác, hãy khẳng định phần hợp lý của đối phương trước rồi mới đưa ra ý kiến khác."],["主持人","给上司汇报工作有什么要注意的？","Gěi shàngsi huìbào gōngzuò yǒu shénme yào zhùyì de?","Báo cáo công việc với cấp trên cần lưu ý gì?"],["李经理","要抓住重点，先说结论，再说原因，这样效率最高。","Yào zhuā zhù zhòngdiǎn, xiān shuō jiélùn, zàishuō yuányīn, zhè yàng xiàolǜ zuì gāo.","Phải nắm trọng tâm, nói kết luận trước rồi mới nói nguyên nhân, như vậy hiệu quả nhất."],["主持人","非常感谢您的建议。","Fēicháng gǎnxiè nín de jiànyì.","Rất cảm ơn lời khuyên của ông."]],"qs":[{"z":"李经理认为最容易犯的错误是什么？","v":"Giám đốc Lý cho rằng sai lầm dễ mắc nhất là gì?","o":["只顾说自己，不认真听","说话声音太小","不写邮件"],"a":0,"s":1},{"z":"给上司汇报时应该先说什么？","v":"Khi báo cáo với cấp trên nên nói gì trước?","o":["原因","结论","问题"],"a":1,"s":7}]},{"id":"p4-02","l":4,"k":"podcast","t":"Podcast: Làm việc từ xa: lợi và hại","lines":[["主持人","疫情以后，远程办公变得越来越普遍。","Yìqíng yǐhòu, yuǎnchéng bàngōng biàn de yuèláiyuè pǔbiàn.","Sau dịch bệnh, làm việc từ xa ngày càng phổ biến."],["主持人","对员工来说，最大的好处是节省了通勤时间，可以更灵活地安排工作和生活。","Duì yuángōng lái shuō, zuì dà de hǎochu shì jiéshěng le tōngqín shíjiān, kěyǐ gèng línghuó de ānpái gōngzuò hé shēnghuó.","Với nhân viên, lợi ích lớn nhất là tiết kiệm thời gian đi lại, có thể sắp xếp công việc và cuộc sống linh hoạt hơn."],["主持人","很多人还发现，在家工作更安静，效率反而提高了。","Hěnduō rén hái fāxiàn, zài jiā gōngzuò gèng ānjìng, xiàolǜ fǎn'ér tígāo le.","Nhiều người còn nhận ra làm việc ở nhà yên tĩnh hơn, hiệu suất lại tăng lên."],["主持人","对公司来说，也可以减少办公室的租金和管理成本。","Duì gōngsī lái shuō, yě kěyǐ jiǎnshǎo bàngōngshì de zūjīn hé guǎnlǐ chéngběn.","Với công ty, cũng giảm được tiền thuê văn phòng và chi phí quản lý."],["主持人","但是，远程办公也有明显的问题。","Dànshì, yuǎnchéng bàngōng yě yǒu míngxiǎn de wèntí.","Nhưng làm việc từ xa cũng có vấn đề rõ rệt."],["主持人","首先，同事之间面对面交流变少，沟通容易出现误会。","Shǒuxiān, tóngshì zhījiān miànduì miàn jiāoliú biàn shǎo, gōutōng róngyì chūxiàn wùhuì.","Trước hết, đồng nghiệp ít trò chuyện trực tiếp, giao tiếp dễ phát sinh hiểu lầm."],["主持人","其次，工作和生活的界限模糊，有些人下班以后仍然在回复邮件，压力很大。","Qícì, gōngzuò hé shēnghuó de jièxiàn móhu, yǒuxiē rén xiàbān yǐhòu réngrán zài huífù yóujiàn, yālì hěn dà.","Thứ hai, ranh giới giữa công việc và cuộc sống mờ đi, có người tan làm vẫn trả lời email, áp lực rất lớn."],["主持人","因此，许多企业选择混合办公，既保持灵活，又保证团队合作。","Yīncǐ, xǔduō qǐyè xuǎnzé hùnhé bàngōng, jì bǎochí línghuó, yòu bǎozhèng tuánduì hézuò.","Vì vậy nhiều doanh nghiệp chọn làm việc kết hợp, vừa linh hoạt vừa đảm bảo hợp tác nhóm."],["主持人","我认为，关键是找到适合自己的平衡点。","Wǒ rènwéi, guānjiàn shì zhǎodào shìhé zìjǐ de pínghéng diǎn.","Tôi cho rằng mấu chốt là tìm được điểm cân bằng phù hợp với bản thân."]],"qs":[{"z":"远程办公对员工最大的好处是什么？","v":"Lợi ích lớn nhất của làm việc từ xa với nhân viên là gì?","o":["节省通勤时间","工资更高","假期更多"],"a":0,"s":1},{"z":"混合办公的特点是什么？","v":"Đặc điểm của làm việc kết hợp là gì?","o":["完全在家工作","既灵活又保证合作","每天都去公司"],"a":1,"s":7}]},{"id":"p4-03","l":4,"k":"podcast","t":"Podcast: Đối mặt với áp lực","lines":[["主持人","现在很多年轻人都说压力很大，您有什么建议？","Xiànzài hěnduō niánqīng rén dōu shuō yālì hěn dà, nín yǒu shénme jiànyì?","Hiện nay nhiều người trẻ nói áp lực rất lớn, bác sĩ có lời khuyên nào?"],["张医生","首先要承认压力是正常的，没有人完全没有压力。","Shǒuxiān yào chéngrèn yālì shì zhèngcháng de, méiyǒu rén wánquán méiyǒu yālì.","Trước hết phải thừa nhận áp lực là bình thường, không ai hoàn toàn không có áp lực."],["主持人","那应该怎么缓解呢？","Nà yīnggāi zěnme huǎnjiě ne?","Vậy nên giảm bớt thế nào?"],["张医生","运动是最有效的办法之一，跑步、游泳都可以让心情变好。","Yùndòng shì zuì yǒuxiào de bànfǎ zhīyī, pǎobù, yóuyǒng dōu kěyǐ ràng xīnqíng biàn hǎo.","Vận động là một trong những cách hiệu quả nhất, chạy bộ, bơi lội đều giúp tâm trạng tốt hơn."],["主持人","除了运动呢？","Chúle yùndòng ne?","Ngoài vận động thì sao?"],["张医生","还可以和朋友聊聊天，把烦恼说出来，心里会轻松很多。","Hái kěyǐ hé péngyou liáo liáotiān, bǎ fánnǎo shuō chūlái, xīn lǐ huì qīngsōng hěnduō.","Còn có thể trò chuyện với bạn bè, nói ra phiền muộn, trong lòng sẽ nhẹ nhõm hơn nhiều."],["主持人","如果工作太忙，没有时间怎么办？","Rúguǒ gōngzuò tài máng, méiyǒu shíjiān zěnme bàn?","Nếu công việc quá bận, không có thời gian thì sao?"],["张医生","哪怕每天只有十分钟，也要给自己留一点儿放松的时间。","Nǎpà měitiān zhǐyǒu shífēn zhōng, yě yào gěi zìjǐ liú yìdiǎnr fàngsōng de shíjiān.","Dù mỗi ngày chỉ có mười phút cũng phải dành cho mình một chút thời gian thư giãn."],["主持人","谢谢您的分享。","Xièxie nín de fēnxiǎng.","Cảm ơn bác sĩ đã chia sẻ."]],"qs":[{"z":"张医生认为压力怎么样？","v":"Bác sĩ Trương cho rằng áp lực như thế nào?","o":["不正常","是正常的","可以完全避免"],"a":1,"s":1},{"z":"工作太忙时应该怎么办？","v":"Khi công việc quá bận nên làm gì?","o":["不要休息","每天留十分钟放松","换一份工作"],"a":1,"s":7}]},{"id":"p4-04","l":4,"k":"podcast","t":"Podcast: Sự phát triển của đường sắt cao tốc Trung Quốc","lines":[["主持人","十几年前，中国开始运营高铁，现在已经是世界上最长的高速铁路网。","Shí jǐ nián qián, Zhōngguó kāishǐ yùnyíng gāotiě, xiànzài yǐjīng shì shìjiè shàng zuì cháng de gāosù tiělù wǎng.","Hơn mười năm trước Trung Quốc bắt đầu vận hành tàu cao tốc, nay đã là mạng đường sắt cao tốc dài nhất thế giới."],["主持人","高铁的速度一般在每小时三百公里左右，从北京到上海只要四个多小时。","Gāotiě de sùdù yìbān zài měi xiǎoshí sān bǎi gōnglǐ zuǒyòu, cóng Běijīng dào Shànghǎi zhǐyào sì gè duō xiǎoshí.","Tốc độ tàu cao tốc thường khoảng ba trăm km mỗi giờ, từ Bắc Kinh đến Thượng Hải chỉ mất hơn bốn tiếng."],["主持人","坐高铁既舒服又准时，所以越来越多的人放弃了飞机。","Zuò gāotiě jì shūfu yòu zhǔnshí, suǒyǐ yuèláiyuè duō de rén fàngqì le fēijī.","Đi tàu cao tốc vừa thoải mái vừa đúng giờ nên ngày càng nhiều người bỏ máy bay."],["主持人","高铁不仅缩短了城市之间的距离，也促进了各地经济的发展。","Gāotiě bùjǐn suōduǎn le chéngshì zhījiān de jùlí, yě cùjìn le gèdì jīngjì de fāzhǎn.","Tàu cao tốc không chỉ rút ngắn khoảng cách giữa các thành phố mà còn thúc đẩy kinh tế các nơi phát triển."],["主持人","许多小城市因为有了高铁站，吸引了更多的游客和企业。","Xǔduō xiǎo chéngshì yīnwèi yǒu le gāotiě zhàn, xīyǐn le gèng duō de yóukè hé qǐyè.","Nhiều thành phố nhỏ nhờ có ga cao tốc đã thu hút thêm du khách và doanh nghiệp."],["主持人","同时，中国的高铁技术也走向了世界，向其他国家提供帮助。","Tóng shí, Zhōngguó de gāotiě jìshù yě zǒu xiàng le shìjiè, xiàng qítā guójiā tígōng bāngzhù.","Đồng thời, công nghệ đường sắt cao tốc của Trung Quốc cũng vươn ra thế giới, hỗ trợ các nước khác."],["主持人","可以说，高铁改变了中国人的生活方式。","Kěyǐ shuō, gāotiě gǎibiàn le Zhōngguórén de shēnghuó fāngshì.","Có thể nói tàu cao tốc đã thay đổi lối sống của người Trung Quốc."],["主持人","未来，高铁还会更快、更安全、更环保。","Wèilái, gāotiě hái huì gèng kuài, gèng ānquán, gèng huánbǎo.","Trong tương lai, tàu cao tốc sẽ còn nhanh hơn, an toàn hơn, thân thiện môi trường hơn."]],"qs":[{"z":"从北京到上海大约要多长时间？","v":"Từ Bắc Kinh đến Thượng Hải mất khoảng bao lâu?","o":["两个小时","四个多小时","十个小时"],"a":1,"s":1},{"z":"高铁带来了什么好处？","v":"Tàu cao tốc mang lại lợi ích gì?","o":["缩短距离，促进经济发展","让票价更贵","让飞机更多"],"a":0,"s":3}]},{"id":"p4-05","l":4,"k":"podcast","t":"Podcast: Đối mặt với thất bại","lines":[["主持人","每个人都会遇到失败，关键是怎么看待它。","Měige rén dōu huì yùdào shībài, guānjiàn shì zěnme kàndài tā.","Ai cũng sẽ gặp thất bại, mấu chốt là nhìn nhận nó thế nào."],["主持人","我曾经创办过一家小公司，开了不到两年就关门了。","Wǒ céngjīng chuàngbàn guo yì jiā xiǎo gōngsī, kāi le búdào liǎng nián jiù guānmén le.","Tôi từng sáng lập một công ty nhỏ, mở chưa đầy hai năm đã đóng cửa."],["主持人","当时我非常难过，甚至不想再做生意。","Dāngshí wǒ fēicháng nánguò, shènzhì bù xiǎng zài zuò shēngyi.","Khi đó tôi rất buồn, thậm chí không muốn kinh doanh nữa."],["主持人","后来，我冷静下来，认真分析了失败的原因：市场调查不够，成本控制也不好。","Hòu lái, wǒ lěngjìng xià lái, rènzhēn fēnxī le shībài de yuányīn: shìchǎng diàochá búgòu, chéngběn kòngzhì yě bù hǎo.","Sau đó tôi bình tĩnh lại, phân tích nghiêm túc nguyên nhân thất bại: khảo sát thị trường chưa đủ, kiểm soát chi phí cũng kém."],["主持人","我发现，失败其实是最好的老师。","Wǒ fāxiàn, shībài qíshí shì zuì hǎo de lǎoshī.","Tôi nhận ra thất bại thực ra là người thầy tốt nhất."],["主持人","它让我明白，做事不能只靠热情，还需要计划和耐心。","Tā ràng wǒ míngbai, zuò shì bù néng zhǐ kào rèqíng, hái xūyào jìhuà hé nàixīn.","Nó giúp tôi hiểu rằng làm việc không thể chỉ dựa vào nhiệt huyết mà còn cần kế hoạch và sự kiên nhẫn."],["主持人","现在我在一家大公司做管理工作，用的正是当年积累的经验。","Xiànzài wǒ zài yì jiā dà gōngsī zuò guǎnlǐ gōngzuò, yòng de zhèng shì dāngnián jīlěi de jīngyàn.","Bây giờ tôi làm quản lý ở một công ty lớn, dùng chính kinh nghiệm tích lũy năm xưa."],["主持人","所以我想对大家说：不要害怕失败，更不要放弃尝试。","Suǒyǐ wǒ xiǎng duì dàjiā shuō: búyào hàipà shībài, gèng búyào fàngqì chángshì.","Vì vậy tôi muốn nói với mọi người: đừng sợ thất bại, càng đừng từ bỏ việc thử sức."]],"qs":[{"z":"他的小公司开了多久？","v":"Công ty nhỏ của anh ấy mở được bao lâu?","o":["不到两年","五年","十年"],"a":0,"s":1},{"z":"他认为失败是什么？","v":"Anh ấy cho rằng thất bại là gì?","o":["最好的老师","最大的问题","没有意义"],"a":0,"s":4}]},{"id":"p4-06","l":4,"k":"podcast","t":"Podcast: Nhập môn quản lý tài chính cá nhân","lines":[["主持人","很多年轻人刚工作，不知道怎么理财，您能给点建议吗？","Hěnduō niánqīng rén gāng gōngzuò, bù zhīdào zěnme lǐcái, nín néng gěi diǎn jiànyì ma?","Nhiều người trẻ mới đi làm không biết quản lý tiền, bạn có lời khuyên nào không?"],["理财师","首先要养成记账的习惯，知道钱都花到哪儿去了。","Shǒuxiān yào yǎngchéng jìzhàng de xíguàn, zhīdào qián dōu huā dào nǎr qù le.","Trước hết phải tập thói quen ghi chép chi tiêu, biết tiền đã tiêu vào đâu."],["主持人","然后呢？","Ránhòu ne?","Sau đó thì sao?"],["理财师","然后每个月先存一部分钱，再安排其他支出，不要等花完了再存。","Ránhòu měige yuè xiān cún yí bùfen qián, zài ānpái qítā zhīchū, búyào děng huā wán le zài cún.","Sau đó mỗi tháng để dành một phần trước rồi mới sắp xếp các khoản chi khác, đừng đợi tiêu xong mới tiết kiệm."],["主持人","投资股票可以吗？","Tóuzī gǔpiào kěyǐ ma?","Đầu tư cổ phiếu có được không?"],["理财师","可以，但是要量力而行，不要把所有的钱都放进去。","Kěyǐ, dànshì yào liànglì ér xíng, búyào bǎ suǒyǒu de qián dōu fàng jìnqù.","Được, nhưng phải liệu sức mà làm, đừng bỏ toàn bộ tiền vào."],["主持人","有什么原则吗？","Yǒu shénme yuánzé ma?","Có nguyên tắc nào không?"],["理财师","不要贪心，也不要完全相信别人的推荐，最重要的是了解自己承担风险的能力。","Búyào tānxīn, yě búyào wánquán xiāngxìn biérén de tuījiàn, zuì zhòngyào de shì liǎojiě zìjǐ chéngdān fēngxiǎn de nénglì.","Đừng tham lam, cũng đừng hoàn toàn tin lời giới thiệu của người khác, quan trọng nhất là hiểu khả năng chịu rủi ro của mình."],["主持人","谢谢，今天受益很多。","Xièxie, jīntiān shòuyì hěnduō.","Cảm ơn, hôm nay tôi học được rất nhiều."]],"qs":[{"z":"首先应该养成什么习惯？","v":"Trước hết nên tập thói quen gì?","o":["记账","买股票","借钱"],"a":0,"s":1},{"z":"投资时的原则是什么？","v":"Nguyên tắc khi đầu tư là gì?","o":["把所有的钱都放进去","不要贪心","完全相信别人"],"a":1,"s":7}]},{"id":"p4-07","l":4,"k":"podcast","t":"Podcast: Văn hóa truyền thống và đời sống hiện đại","lines":[["主持人","现在的年轻人越来越喜欢传统文化。","Xiànzài de niánqīng rén yuèláiyuè xǐhuan chuántǒng wénhuà.","Người trẻ ngày nay ngày càng yêu thích văn hóa truyền thống."],["主持人","穿汉服逛街、学书法、听戏曲，都成了新的潮流。","Chuān Hànfú guàngjiē, xué shūfǎ, tīng xìqǔ, dōu chéng le xīn de cháoliú.","Mặc Hán phục đi dạo phố, học thư pháp, nghe tuồng đều trở thành xu hướng mới."],["主持人","这说明，传统并不意味着落后，它也可以很时尚。","Zhè shuōmíng, chuántǒng bìngbù yìwèizhe luòhòu, tā yě kěyǐ hěn shíshàng.","Điều này cho thấy truyền thống không có nghĩa là lạc hậu, nó cũng có thể rất thời thượng."],["主持人","比如，许多品牌把传统图案放进现代设计里，受到了年轻人的欢迎。","Bǐrú, xǔduō pǐnpái bǎ chuántǒng tú'àn fàng jìn xiàndài shèjì lǐ, shòu dào le niánqīng rén de huānyíng.","Ví dụ nhiều thương hiệu đưa họa tiết truyền thống vào thiết kế hiện đại và được giới trẻ yêu thích."],["主持人","同时，网络和短视频让传统文化传播得更快更广。","Tóng shí, wǎngluò hé duǎn shìpín ràng chuántǒng wénhuà chuánbō de gèng kuài gèng guǎng.","Đồng thời mạng và video ngắn giúp văn hóa truyền thống lan truyền nhanh và rộng hơn."],["主持人","当然，也有人担心，这种热闹可能只是表面的。","Dāngrán, yě yǒurén dānxīn, zhè zhǒng rènao kěnéng zhǐshì biǎomiàn de.","Tất nhiên cũng có người lo rằng sự nhộn nhịp này có thể chỉ là bề ngoài."],["主持人","我认为，真正的继承不是简单的模仿，而是理解背后的思想，并用自己的方式表达出来。","Wǒ rènwéi, zhēnzhèng de jìchéng bú shì jiǎndān de mófǎng, ér shì lǐjiě bèi hòu de sīxiǎng, bìng yòng zìjǐ de fāngshì biǎodá chūlái.","Tôi cho rằng kế thừa thực sự không phải bắt chước đơn giản mà là hiểu tư tưởng phía sau và diễn đạt bằng cách của riêng mình."],["主持人","只有这样，传统才能不断延续下去。","Zhǐyǒu zhè yàng, chuántǒng cái néng búduàn yánxù xià qù.","Chỉ có như vậy truyền thống mới có thể tiếp nối không ngừng."]],"qs":[{"z":"现在的年轻人越来越喜欢什么？","v":"Người trẻ ngày nay ngày càng thích điều gì?","o":["传统文化","国外品牌","只看电影"],"a":0,"s":0},{"z":"说话人认为真正的继承是什么？","v":"Người nói cho rằng kế thừa thực sự là gì?","o":["简单模仿","理解背后的思想","只穿汉服"],"a":1,"s":6}]},{"id":"p4-08","l":4,"k":"podcast","t":"Podcast: Tắc nghẽn giao thông đô thị","lines":[["主持人","大城市的交通拥堵越来越严重，您觉得原因是什么？","Dà chéngshì de jiāotōng yōngdǔ yuèláiyuè yánzhòng, nín juéde yuányīn shì shénme?","Tắc nghẽn giao thông ở các thành phố lớn ngày càng nghiêm trọng, ông thấy nguyên nhân là gì?"],["专家","主要是汽车数量增长太快，而道路面积增长有限。","Zhǔyào shì qìchē shùliàng zēngzhǎng tài kuài, ér dàolù miànjī zēngzhǎng yǒuxiàn.","Chủ yếu là số lượng ô tô tăng quá nhanh, trong khi diện tích đường chỉ tăng hạn chế."],["主持人","政府采取了哪些措施？","Zhèngfǔ cǎiqǔ le nǎxiē cuòshī?","Chính phủ đã áp dụng những biện pháp nào?"],["专家","比如限制车牌数量、提高停车费，同时大力发展地铁和公交。","Bǐrú xiànzhì chēpái shùliàng, tígāo tíngchēfèi, tóng shí dàlì fāzhǎn dìtiě hé gōngjiāo.","Ví dụ hạn chế số biển số xe, tăng phí đỗ xe, đồng thời mạnh tay phát triển tàu điện ngầm và xe buýt."],["主持人","这些措施效果怎么样？","Zhè xiē cuòshī xiàoguǒ zěnmeyàng?","Những biện pháp này hiệu quả thế nào?"],["专家","有一定的效果，但是还不够。","Yǒu yídìng de xiàoguǒ, dànshì hái búgòu.","Có hiệu quả nhất định nhưng vẫn chưa đủ."],["主持人","您对市民有什么建议？","Nín duì shìmín yǒu shénme jiànyì?","Ông có lời khuyên nào cho người dân?"],["专家","尽量选择公共交通，或者错开上下班的高峰时间。","Jǐnliàng xuǎnzé gōnggòng jiāotōng, huòzhě cuòkāi shàng xiàbān de gāofēng shíjiān.","Cố gắng chọn phương tiện công cộng hoặc tránh giờ cao điểm đi làm và tan làm."],["主持人","感谢您的分享。","Gǎnxiè nín de fēnxiǎng.","Cảm ơn ông đã chia sẻ."]],"qs":[{"z":"交通拥堵的主要原因是什么？","v":"Nguyên nhân chính gây tắc nghẽn là gì?","o":["汽车数量增长太快","道路太多","人太少"],"a":0,"s":1},{"z":"专家建议市民怎么做？","v":"Chuyên gia khuyên người dân làm gì?","o":["多开车","选择公共交通","晚上出门"],"a":1,"s":7}]},{"id":"p4-09","l":4,"k":"podcast","t":"Podcast: Câu chuyện khởi nghiệp","lines":[["主持人","我的创业故事要从一次失败的旅行说起。","Wǒ de chuàngyè gùshi yào cóng yí cì shībài de lǚxíng shuō qǐ.","Câu chuyện khởi nghiệp của tôi bắt đầu từ một chuyến du lịch thất bại."],["主持人","那次旅行中，我发现很多游客不知道当地有哪些好玩的地方，也没有好用的路线推荐。","Nà cì lǚxíng zhōng, wǒ fāxiàn hěnduō yóukè bù zhīdào dāngdì yǒu nǎxiē hǎowán de dìfang, yě méiyǒu hǎo yòng de lùxiàn tuījiàn.","Trong chuyến đi đó, tôi thấy nhiều du khách không biết địa phương có những nơi nào hay, cũng không có gợi ý lộ trình dễ dùng."],["主持人","我想，如果能做一个简单的应用，帮助大家规划行程，一定会有市场。","Wǒ xiǎng, rúguǒ néng zuò yí gè jiǎndān de yìngyòng, bāngzhù dàjiā guīhuà xíngchéng, yídìng huì yǒu shìchǎng.","Tôi nghĩ nếu làm được một ứng dụng đơn giản giúp mọi người lên kế hoạch hành trình thì chắc chắn có thị trường."],["主持人","于是，我辞去了稳定的工作，和两个朋友一起开始了创业。","Yúshì, wǒ cíqù le wěndìng de gōngzuò, hé liǎng gè péngyou yìqǐ kāishǐ le chuàngyè.","Thế là tôi bỏ công việc ổn định, cùng hai người bạn bắt đầu khởi nghiệp."],["主持人","最初的半年，我们没有收入，每个人都住在很小的房子里，常常加班到深夜。","Zuìchū de bàn nián, wǒmen méiyǒu shōurù, měige rén dōu zhù zài hěn xiǎo de fángzi lǐ, chángcháng jiābān dào shēnyè.","Nửa năm đầu chúng tôi không có thu nhập, ai cũng ở trong căn nhà rất nhỏ, thường tăng ca đến khuya."],["主持人","但是大家相信，只要产品足够好，用户一定会喜欢。","Dànshì dàjiā xiāngxìn, zhǐyào chǎnpǐn zúgòu hǎo, yònghù yídìng huì xǐhuan.","Nhưng mọi người tin rằng chỉ cần sản phẩm đủ tốt, người dùng nhất định sẽ thích."],["主持人","后来，我们的应用得到了投资，用户也越来越多。","Hòu lái, wǒmen de yìngyòng dédào le tóuzī, yònghù yě yuèláiyuè duō.","Sau đó ứng dụng của chúng tôi nhận được đầu tư, người dùng cũng ngày càng nhiều."],["主持人","回头看这段经历，最重要的不是运气，而是坚持和团队合作。","Huítóu kàn zhè duàn jīnglì, zuì zhòngyào de bú shì yùnqi, ér shì jiānchí hé tuánduì hézuò.","Nhìn lại chặng đường này, điều quan trọng nhất không phải vận may mà là sự kiên trì và hợp tác nhóm."]],"qs":[{"z":"创业的想法来自哪里？","v":"Ý tưởng khởi nghiệp đến từ đâu?","o":["一次旅行","一次考试","一本书"],"a":0,"s":0},{"z":"最初半年他们的情况怎么样？","v":"Nửa năm đầu tình hình của họ thế nào?","o":["没有收入","收入很高","很轻松"],"a":0,"s":4}]},{"id":"p4-10","l":4,"k":"podcast","t":"Podcast: Ý nghĩa của việc đọc sách","lines":[["主持人","有人问我：现在手机上什么都有，为什么还要读书？","Yǒurén wèn wǒ: xiànzài shǒujī shàng shénme dōu yǒu, wèishénme hái yào dúshū?","Có người hỏi tôi: Bây giờ trên điện thoại có đủ thứ, vì sao còn phải đọc sách?"],["主持人","我的回答是，读书和刷手机完全不一样。","Wǒ de huídá shì, dúshū hé shuā shǒujī wánquán bù yíyàng.","Câu trả lời của tôi là đọc sách và lướt điện thoại hoàn toàn khác nhau."],["主持人","手机上的信息往往是零散的，而一本好书能帮助我们形成完整的思考。","Shǒujī shàng de xìnxī wǎngwǎng shì língsǎn de, ér yì běn hǎo shū néng bāngzhù wǒmen xíngchéng wánzhěng de sīkǎo.","Thông tin trên điện thoại thường rời rạc, còn một cuốn sách hay giúp ta hình thành tư duy hoàn chỉnh."],["主持人","读书的过程需要专心，而这种专注的能力，恰恰是现代人最缺少的。","Dúshū de guòchéng xūyào zhuānxīn, ér zhè zhǒng zhuānzhù de nénglì, qiàqià shì xiàndài rén zuì quēshǎo de.","Quá trình đọc sách cần tập trung, mà khả năng tập trung này lại chính là thứ người hiện đại thiếu nhất."],["主持人","更重要的是，书让我们看到不同的人生，增加理解和同情。","Gèng zhòngyào de shì, shū ràng wǒmen kàndào bùtóng de rén shēng, zēngjiā lǐjiě hé tóngqíng.","Quan trọng hơn, sách cho ta thấy những cuộc đời khác nhau, tăng thêm sự thấu hiểu và đồng cảm."],["主持人","当然，读书不一定要读很多，关键是读懂、读透，并且和生活联系起来。","Dāngrán, dúshū bù yídìng yào dú hěnduō, guānjiàn shì dú dǒng, dú tòu, bìngqiě hé shēnghuó liánxì qǐlái.","Tất nhiên đọc sách không nhất thiết phải đọc nhiều, mấu chốt là đọc hiểu, đọc thấu và gắn với cuộc sống."],["主持人","我建议每天睡觉前读半小时，既能放松，又能积累知识。","Wǒ jiànyì měitiān shuìjiào qián dú bàn xiǎoshí, jì néng fàngsōng, yòu néng jīlěi zhīshi.","Tôi khuyên mỗi ngày đọc nửa tiếng trước khi ngủ, vừa thư giãn vừa tích lũy kiến thức."],["主持人","坚持一年，你会发现自己的想法和以前不一样了。","Jiānchí yì nián, nǐ huì fāxiàn zìjǐ de xiǎngfǎ hé yǐqián bù yíyàng le.","Kiên trì một năm, bạn sẽ thấy suy nghĩ của mình khác trước."]],"qs":[{"z":"手机上的信息往往怎么样？","v":"Thông tin trên điện thoại thường như thế nào?","o":["零散","完整","准确"],"a":0,"s":2},{"z":"作者建议什么时候读书？","v":"Tác giả khuyên đọc sách lúc nào?","o":["早上起床前","睡觉前","上班时"],"a":1,"s":6}]}];TEXTS.push(...TEXTP);
