const TEXTW=[{"id":"w2-01","l":2,"k":"dialogue","c":"work","t":"Xin nghỉ phép","lines":[["员工","经理，我明天想请一天假。","Jīnglǐ, wǒ míngtiān xiǎng qǐng yì tiān jià.","Giám đốc, ngày mai tôi muốn xin nghỉ một ngày."],["经理","为什么？你不舒服吗？","Wèishénme? Nǐ bù shūfu ma?","Tại sao? Bạn không khỏe à?"],["员工","不是，我要陪我妈妈去医院。","Bú shì, wǒ yào péi wǒ māma qù yīyuàn.","Không phải, tôi phải đưa mẹ đi bệnh viện."],["经理","好的，可以请假。你的工作安排好了吗？","Hǎo de, kěyǐ qǐngjià. Nǐ de gōngzuò ānpái hǎo le ma?","Được, bạn có thể nghỉ. Công việc đã sắp xếp xong chưa?"],["员工","已经安排好了，小李会帮我。","Yǐjīng ānpái hǎo le, Xiǎo Lǐ huì bāng wǒ.","Đã sắp xếp xong rồi, Tiểu Lý sẽ giúp tôi."],["经理","那就好。后天早点来上班。","Nà jiù hǎo. Hòutiān zǎodiǎn lái shàngbān.","Vậy thì tốt. Ngày kia đến làm sớm nhé."]],"qs":[{"z":"员工为什么请假？","v":"Tại sao nhân viên xin nghỉ?","o":["自己生病了","陪妈妈去医院","去旅游"],"a":1,"s":2},{"z":"谁会帮员工做工作？","v":"Ai sẽ giúp nhân viên làm việc?","o":["小李","经理","妈妈"],"a":0,"s":4}]},{"id":"w2-02","l":2,"k":"podcast","c":"work","t":"Podcast: Một ngày đi làm","lines":[["主持人","大家好！今天我们聊聊上班的一天。","Dàjiā hǎo! Jīntiān wǒmen liáoliáo shàngbān de yì tiān.","Chào mọi người! Hôm nay chúng ta nói về một ngày đi làm."],["主持人","小王每天七点起床，八点半到公司。","Xiǎo Wáng měitiān qī diǎn qǐchuáng, bā diǎn bàn dào gōngsī.","Tiểu Vương mỗi ngày bảy giờ dậy, tám rưỡi đến công ty."],["主持人","上午他先看邮件，然后开会。","Shàngwǔ tā xiān kàn yóujiàn, ránhòu kāihuì.","Buổi sáng anh ấy xem email trước, sau đó họp."],["主持人","中午他和同事一起吃饭，休息一个小时。","Zhōngwǔ tā hé tóngshì yìqǐ chīfàn, xiūxi yí gè xiǎoshí.","Buổi trưa anh ấy ăn cùng đồng nghiệp, nghỉ một tiếng."],["主持人","下午他写报告，打电话给客户。","Xiàwǔ tā xiě bàogào, dǎ diànhuà gěi kèhù.","Buổi chiều anh ấy viết báo cáo, gọi điện cho khách hàng."],["主持人","如果工作多，他会加班到七点。","Rúguǒ gōngzuò duō, tā huì jiābān dào qī diǎn.","Nếu việc nhiều, anh ấy sẽ tăng ca đến bảy giờ."]],"qs":[{"z":"小王几点到公司？","v":"Tiểu Vương mấy giờ đến công ty?","o":["八点半","七点","九点"],"a":0,"s":1},{"z":"上午他先做什么？","v":"Buổi sáng anh ấy làm gì trước?","o":["开会","看邮件","写报告"],"a":1,"s":2},{"z":"如果工作多，他会怎么样？","v":"Nếu việc nhiều thì anh ấy sẽ thế nào?","o":["早点回家","加班到七点","请假"],"a":1,"s":5}]},{"id":"w3-01","l":3,"k":"dialogue","c":"work","t":"Họp nhóm về dự án","lines":[["经理","好，我们开始开会。先说一下这个项目的进度。","Hǎo, wǒmen kāishǐ kāihuì. Xiān shuō yíxià zhège xiàngmù de jìndù.","Được, chúng ta bắt đầu họp. Trước hết nói về tiến độ dự án này."],["小张","目前完成了百分之六十，设计部分已经做完了。","Mùqián wánchéng le bǎi fēn zhī liùshí, shèjì bùfen yǐjīng zuòwán le.","Hiện đã hoàn thành 60%, phần thiết kế đã làm xong."],["经理","那什么时候能全部做完？","Nà shénme shíhou néng quánbù zuòwán?","Vậy khi nào có thể làm xong toàn bộ?"],["小张","如果没有问题，下个月十号可以完成。","Rúguǒ méiyǒu wèntí, xià ge yuè shí hào kěyǐ wánchéng.","Nếu không có vấn đề, ngày 10 tháng sau có thể hoàn thành."],["小李","我担心预算不够，材料的价格涨了。","Wǒ dānxīn yùsuàn bú gòu, cáiliào de jiàgé zhǎng le.","Tôi lo ngân sách không đủ, giá nguyên liệu đã tăng."],["经理","好，会后你把具体数字发给我，我们再讨论。","Hǎo, huì hòu nǐ bǎ jùtǐ shùzì fā gěi wǒ, wǒmen zài tǎolùn.","Được, sau họp bạn gửi số liệu cụ thể cho tôi, chúng ta sẽ bàn lại."]],"qs":[{"z":"项目现在完成了多少？","v":"Hiện dự án đã hoàn thành bao nhiêu?","o":["百分之六十","百分之十","全部"],"a":0,"s":1},{"z":"小李担心什么？","v":"Tiểu Lý lo lắng điều gì?","o":["预算不够","设计不好","时间太长"],"a":0,"s":4},{"z":"会后小李要做什么？","v":"Sau họp Tiểu Lý phải làm gì?","o":["发具体数字","做设计","请假"],"a":0,"s":5}]},{"id":"w3-02","l":3,"k":"dialogue","c":"work","t":"Phỏng vấn xin việc","lines":[["面试官","请先做一下自我介绍。","Qǐng xiān zuò yíxià zìwǒ jièshào.","Xin hãy tự giới thiệu trước."],["应聘者","我叫林雪，大学学的是市场营销，有两年工作经验。","Wǒ jiào Lín Xuě, dàxué xué de shì shìchǎng yíngxiāo, yǒu liǎng nián gōngzuò jīngyàn.","Tôi tên Lâm Tuyết, đại học học marketing, có hai năm kinh nghiệm làm việc."],["面试官","你为什么想来我们公司？","Nǐ wèishénme xiǎng lái wǒmen gōngsī?","Vì sao bạn muốn đến công ty chúng tôi?"],["应聘者","因为贵公司发展很快，我也希望有更多学习的机会。","Yīnwèi guì gōngsī fāzhǎn hěn kuài, wǒ yě xīwàng yǒu gèng duō xuéxí de jīhuì.","Vì quý công ty phát triển nhanh, tôi cũng mong có thêm cơ hội học hỏi."],["面试官","你觉得自己最大的优点是什么？","Nǐ juéde zìjǐ zuì dà de yōudiǎn shì shénme?","Bạn thấy ưu điểm lớn nhất của mình là gì?"],["应聘者","我做事很认真，也很会和别人合作。","Wǒ zuòshì hěn rènzhēn, yě hěn huì hé biérén hézuò.","Tôi làm việc rất nghiêm túc, cũng rất biết hợp tác với người khác."],["面试官","好的，我们会在三天内通知你结果。","Hǎo de, wǒmen huì zài sān tiān nèi tōngzhī nǐ jiéguǒ.","Được, chúng tôi sẽ báo kết quả cho bạn trong vòng ba ngày."]],"qs":[{"z":"林雪大学学的是什么？","v":"Lâm Tuyết học ngành gì ở đại học?","o":["市场营销","经济","中文"],"a":0,"s":1},{"z":"她为什么想来这家公司？","v":"Vì sao cô ấy muốn vào công ty này?","o":["工资很高","公司发展很快","离家很近"],"a":1,"s":3},{"z":"什么时候通知面试结果？","v":"Khi nào thông báo kết quả phỏng vấn?","o":["三天内","下个月","明天"],"a":0,"s":6}]},{"id":"w3-03","l":3,"k":"passage","c":"work","t":"Email gửi khách hàng","lines":[["","李经理您好：","Lǐ jīnglǐ nín hǎo:","Chào Giám đốc Lý:"],["","感谢您上周来公司参观。","Gǎnxiè nín shàng zhōu lái gōngsī cānguān.","Cảm ơn ông đã đến thăm công ty tuần trước."],["","附件是我们的最新报价和产品介绍，请您查看。","Fùjiàn shì wǒmen de zuì xīn bàojià hé chǎnpǐn jièshào, qǐng nín chákàn.","Đính kèm là báo giá mới nhất và giới thiệu sản phẩm, xin ông xem qua."],["","如果您有任何问题，欢迎随时和我联系。","Rúguǒ nín yǒu rènhé wèntí, huānyíng suíshí hé wǒ liánxì.","Nếu ông có bất kỳ câu hỏi nào, hoan nghênh liên hệ tôi bất cứ lúc nào."],["","希望能尽快得到您的回复。","Xīwàng néng jǐnkuài dédào nín de huífù.","Mong sớm nhận được phản hồi của ông."],["","祝工作顺利！","Zhù gōngzuò shùnlì!","Chúc công việc thuận lợi!"]],"qs":[{"z":"附件里有什么？","v":"Tệp đính kèm có gì?","o":["报价和产品介绍","合同","旅行计划"],"a":0,"s":2},{"z":"写信的人希望什么？","v":"Người viết thư mong điều gì?","o":["尽快得到回复","马上见面","降低价格"],"a":0,"s":4}]},{"id":"w3-04","l":3,"k":"podcast","c":"work","t":"Podcast: Quản lý thời gian","lines":[["主持人","大家好，今天我们来聊聊怎样管理时间。","Dàjiā hǎo, jīntiān wǒmen lái liáoliáo zěnyàng guǎnlǐ shíjiān.","Chào mọi người, hôm nay chúng ta nói về cách quản lý thời gian."],["主持人","第一，每天早上先写下最重要的三件事。","Dì yī, měitiān zǎoshang xiān xiěxià zuì zhòngyào de sān jiàn shì.","Thứ nhất, mỗi sáng hãy viết ra ba việc quan trọng nhất."],["主持人","第二，先做难的，再做简单的。","Dì èr, xiān zuò nán de, zài zuò jiǎndān de.","Thứ hai, làm việc khó trước, rồi làm việc dễ."],["主持人","第三，工作的时候关掉手机的通知。","Dì sān, gōngzuò de shíhou guāndiào shǒujī de tōngzhī.","Thứ ba, khi làm việc hãy tắt thông báo của điện thoại."],["主持人","很多人觉得忙，其实是因为没有计划。","Hěnduō rén juéde máng, qíshí shì yīnwèi méiyǒu jìhuà.","Nhiều người thấy bận, thực ra là vì không có kế hoạch."],["主持人","好，今天就说到这儿，我们下次再见。","Hǎo, jīntiān jiù shuō dào zhèr, wǒmen xià cì zàijiàn.","Được, hôm nay nói đến đây, hẹn gặp lần sau."]],"qs":[{"z":"第二个方法是什么？","v":"Cách thứ hai là gì?","o":["先做难的","先做简单的","先休息"],"a":0,"s":2},{"z":"工作的时候应该怎么做？","v":"Khi làm việc nên làm gì?","o":["关掉手机通知","多看手机","边吃边做"],"a":0,"s":3},{"z":"很多人为什么觉得忙？","v":"Vì sao nhiều người thấy bận?","o":["没有计划","工作太少","睡得太多"],"a":0,"s":4}]},{"id":"w4-01","l":4,"k":"dialogue","c":"work","t":"Đàm phán hợp đồng","lines":[["甲方","关于价格，我们希望能再降百分之五。","Guānyú jiàgé, wǒmen xīwàng néng zài jiàng bǎi fēn zhī wǔ.","Về giá, chúng tôi hy vọng giảm thêm 5%."],["乙方","这个价格已经很合理了，原材料的成本一直在上涨。","Zhège jiàgé yǐjīng hěn hélǐ le, yuáncáiliào de chéngběn yìzhí zài shàngzhǎng.","Mức giá này đã rất hợp lý, chi phí nguyên liệu liên tục tăng."],["甲方","如果我们的订单量增加一倍呢？","Rúguǒ wǒmen de dìngdān liàng zēngjiā yí bèi ne?","Nếu lượng đơn đặt hàng của chúng tôi tăng gấp đôi thì sao?"],["乙方","那样的话，我们可以考虑降低百分之三。","Nàyàng dehuà, wǒmen kěyǐ kǎolǜ jiàngdī bǎi fēn zhī sān.","Nếu vậy, chúng tôi có thể cân nhắc giảm 3%."],["甲方","另外，交货时间能不能提前一周？","Lìngwài, jiāohuò shíjiān néng bù néng tíqián yì zhōu?","Ngoài ra, thời gian giao hàng có thể sớm hơn một tuần không?"],["乙方","这一点我们可以保证，但是要在合同里写清楚。","Zhè yìdiǎn wǒmen kěyǐ bǎozhèng, dànshì yào zài hétong lǐ xiě qīngchu.","Điểm này chúng tôi có thể đảm bảo, nhưng phải ghi rõ trong hợp đồng."]],"qs":[{"z":"甲方一开始希望降价多少？","v":"Ban đầu bên A hy vọng giảm giá bao nhiêu?","o":["百分之五","百分之三","百分之十"],"a":0,"s":0},{"z":"订单量增加一倍，乙方愿意怎么样？","v":"Nếu đơn tăng gấp đôi, bên B sẵn lòng thế nào?","o":["降低百分之三","不降价","降低百分之五"],"a":0,"s":3},{"z":"提前交货的要求，乙方说什么？","v":"Về yêu cầu giao sớm, bên B nói gì?","o":["要写进合同里","绝对不可以","没有问题，不用写"],"a":0,"s":5}]},{"id":"w4-02","l":4,"k":"podcast","c":"work","t":"Podcast: Kỹ năng thuyết trình","lines":[["主持人","欢迎收听职场小课堂。今天的话题是如何做好一次演示。","Huānyíng shōutīng zhíchǎng xiǎo kètáng. Jīntiān de huàtí shì rúhé zuòhǎo yí cì yǎnshì.","Chào mừng đến lớp học công sở nhỏ. Chủ đề hôm nay là làm thế nào để thuyết trình tốt."],["主持人","首先，要清楚听众是谁，他们最关心什么。","Shǒuxiān, yào qīngchu tīngzhòng shì shéi, tāmen zuì guānxīn shénme.","Trước tiên, cần biết người nghe là ai, họ quan tâm điều gì nhất."],["主持人","其次，每页幻灯片只放一个重点，文字不要太多。","Qícì, měi yè huàndēngpiàn zhǐ fàng yí gè zhòngdiǎn, wénzì búyào tài duō.","Thứ hai, mỗi trang slide chỉ đặt một trọng điểm, chữ đừng quá nhiều."],["主持人","再次，提前练习几遍，控制好时间。","Zàicì, tíqián liànxí jǐ biàn, kòngzhì hǎo shíjiān.","Tiếp theo, luyện tập trước vài lần, kiểm soát tốt thời gian."],["主持人","最后，别忘了留出时间回答问题。","Zuìhòu, bié wàng le liúchū shíjiān huídá wèntí.","Cuối cùng, đừng quên chừa thời gian trả lời câu hỏi."],["主持人","只要准备充分，你就不会紧张。","Zhǐyào zhǔnbèi chōngfèn, nǐ jiù bú huì jǐnzhāng.","Chỉ cần chuẩn bị đầy đủ, bạn sẽ không căng thẳng."]],"qs":[{"z":"做演示首先要了解什么？","v":"Làm thuyết trình trước hết cần hiểu điều gì?","o":["听众是谁","老板的年龄","公司的地址"],"a":0,"s":1},{"z":"每页幻灯片应该怎么样？","v":"Mỗi trang slide nên thế nào?","o":["只放一个重点","放很多文字","不放内容"],"a":0,"s":2},{"z":"怎样才不会紧张？","v":"Làm sao để không căng thẳng?","o":["准备充分","少说话","不看听众"],"a":0,"s":5}]},{"id":"w4-03","l":4,"k":"dialogue","c":"work","t":"Giải quyết khiếu nại","lines":[["客户","你好，我上周买的机器坏了，我要投诉。","Nǐ hǎo, wǒ shàng zhōu mǎi de jīqì huài le, wǒ yào tóusù.","Chào, cái máy tôi mua tuần trước hỏng rồi, tôi muốn khiếu nại."],["客服","非常抱歉给您带来不便，请问具体是什么问题？","Fēicháng bàoqiàn gěi nín dàilái búbiàn, qǐngwèn jùtǐ shì shénme wèntí?","Rất xin lỗi vì đã gây bất tiện, xin hỏi cụ thể là vấn đề gì?"],["客户","开机以后没有反应，我已经试了好几次。","Kāijī yǐhòu méiyǒu fǎnyìng, wǒ yǐjīng shì le hǎo jǐ cì.","Bật máy lên không có phản ứng, tôi đã thử mấy lần rồi."],["客服","明白了。我们可以免费为您更换，或者全额退款，您想选哪一种？","Míngbai le. Wǒmen kěyǐ miǎnfèi wèi nín gēnghuàn, huòzhě quán'é tuìkuǎn, nín xiǎng xuǎn nǎ yì zhǒng?","Đã hiểu. Chúng tôi có thể đổi miễn phí cho ông, hoặc hoàn lại toàn bộ tiền, ông muốn chọn cách nào?"],["客户","我想换一台新的，越快越好。","Wǒ xiǎng huàn yì tái xīn de, yuè kuài yuè hǎo.","Tôi muốn đổi một cái mới, càng nhanh càng tốt."],["客服","好的，我们会在两个工作日内寄出，请您留意快递信息。","Hǎo de, wǒmen huì zài liǎng gè gōngzuò rì nèi jìchū, qǐng nín liúyì kuàidì xìnxī.","Vâng, chúng tôi sẽ gửi đi trong hai ngày làm việc, xin ông chú ý thông tin chuyển phát."]],"qs":[{"z":"客户为什么投诉？","v":"Vì sao khách hàng khiếu nại?","o":["机器坏了","价格太高","送货太慢"],"a":0,"s":0},{"z":"客户最后选择了什么？","v":"Cuối cùng khách chọn gì?","o":["换一台新的","全额退款","自己修理"],"a":0,"s":4},{"z":"公司会在多长时间内寄出？","v":"Công ty sẽ gửi trong bao lâu?","o":["两个工作日内","一个月内","当天"],"a":0,"s":5}]}];TEXTS.push(...TEXTW);
const GRAM=[{"id":"g1-1","l":1,"t":"Câu có 是: A là B","p":"A + 是 + B  |  A + 不是 + B","e":"是 nối hai danh từ hoặc đại từ, nghĩa là “là”. Phủ định thêm 不 trước 是. Câu hỏi thêm 吗 ở cuối.","ex":[["我是学生。","Wǒ shì xuésheng.","Tôi là học sinh."],["他不是老师。","Tā bú shì lǎoshī.","Anh ấy không phải giáo viên."],["你是越南人吗？","Nǐ shì Yuènánrén ma?","Bạn là người Việt Nam à?"]],"n":"Trước tính từ thường dùng 很, không dùng 是: nói 我很忙, không nói 我是忙.","f":[{"l":1,"s":"他___老师。","o":["是","有","在"],"a":"是","t":"Anh ấy là giáo viên.","e":"是 nối hai danh từ."},{"l":1,"s":"她不___我的姐姐。","o":["是","很","有"],"a":"是","t":"Cô ấy không phải chị tôi.","e":"Phủ định của 是 là 不是."}],"b":{"l":1,"w":["他","是","我的","朋友"],"t":"Anh ấy là bạn của tôi.","e":"是 đứng giữa hai danh từ."}},{"id":"g1-2","l":1,"t":"Câu hỏi với 吗, 呢, 什么","p":"…吗？ | …，你呢？ | 什么","e":"吗 đặt cuối câu trần thuật để hỏi có/không. 呢 dùng để hỏi lại “còn bạn thì sao?”. 什么 hỏi “cái gì” và đứng đúng vị trí của từ được hỏi, không đảo lên đầu câu như tiếng Việt.","ex":[["你喜欢喝茶吗？","Nǐ xǐhuan hē chá ma?","Bạn thích uống trà không?"],["我很好，你呢？","Wǒ hěn hǎo, nǐ ne?","Tôi khỏe, còn bạn?"],["你喝什么？","Nǐ hē shénme?","Bạn uống gì?"]],"n":"Không dùng 吗 cùng lúc với 什么 hoặc câu hỏi khác trong một câu.","f":[{"l":1,"s":"你喜欢喝茶___？","o":["吗","的","了"],"a":"吗","t":"Bạn thích uống trà không?","e":"吗 tạo câu hỏi có/không."},{"l":1,"s":"我很好，你___？","o":["呢","吗","的"],"a":"呢","t":"Tôi khỏe, còn bạn?","e":"呢 hỏi lại."}],"b":{"l":1,"w":["你","喝","什么"],"t":"Bạn uống gì?","e":"什么 đứng ở vị trí tân ngữ."}},{"id":"g1-3","l":1,"t":"有 và 没有","p":"A + 有 + B  |  A + 没有 + B","e":"有 diễn tả sở hữu hoặc tồn tại. Phủ định của 有 luôn là 没有, không bao giờ là 不有. Hỏi: 有…吗? hoặc 有没有…?","ex":[["我有两个哥哥。","Wǒ yǒu liǎng gè gēge.","Tôi có hai anh trai."],["他没有手机。","Tā méiyǒu shǒujī.","Anh ấy không có điện thoại."],["你有时间吗？","Nǐ yǒu shíjiān ma?","Bạn có thời gian không?"]],"n":"Sai: 我不有钱. Đúng: 我没有钱.","f":[{"l":1,"s":"我___手机。","o":["没有","不有","不是"],"a":"没有","t":"Tôi không có điện thoại.","e":"Phủ định của 有 là 没有."},{"l":1,"s":"你___姐姐吗？","o":["有","很","不"],"a":"有","t":"Bạn có chị gái không?","e":"有…吗 hỏi sở hữu."}],"b":{"l":1,"w":["我","没有","时间"],"t":"Tôi không có thời gian.","e":"没有 đứng trước danh từ."}},{"id":"g1-4","l":1,"t":"Phủ định: 不 và 没","p":"不 + V (thói quen, tương lai)  |  没(有) + V (quá khứ)","e":"不 phủ định thói quen, ý muốn, hiện tại và tương lai. 没(有) phủ định việc đã xảy ra trong quá khứ hoặc chưa xảy ra. 不 đọc thành bú khi đứng trước thanh 4.","ex":[["我不喝咖啡。","Wǒ bù hē kāfēi.","Tôi không uống cà phê."],["昨天我没去学校。","Zuótiān wǒ méi qù xuéxiào.","Hôm qua tôi không đến trường."],["他明天不来。","Tā míngtiān bù lái.","Ngày mai anh ấy không đến."]],"n":"Có 昨天 hoặc 了 (đã xảy ra) thì phủ định bằng 没, không dùng 不.","f":[{"l":1,"s":"昨天他___来上班。","o":["没","不","别"],"a":"没","t":"Hôm qua anh ấy không đến làm.","e":"Việc quá khứ phủ định bằng 没."},{"l":1,"s":"明天我___去学校。","o":["不","没","有"],"a":"不","t":"Ngày mai tôi không đến trường.","e":"Tương lai phủ định bằng 不."}],"b":{"l":1,"w":["昨天","我","没","去","学校"],"t":"Hôm qua tôi không đến trường.","e":"没 đứng ngay trước động từ."}},{"id":"g1-5","l":1,"t":"Trật tự câu: thời gian, địa điểm","p":"S + thời gian + địa điểm + V","e":"Từ chỉ thời gian và địa điểm đứng trước động từ, khác với tiếng Việt thường để ở cuối. Thời gian đứng trước địa điểm.","ex":[["我明天去北京。","Wǒ míngtiān qù Běijīng.","Ngày mai tôi đi Bắc Kinh."],["她每天早上七点起床。","Tā měitiān zǎoshang qī diǎn qǐchuáng.","Mỗi sáng bảy giờ cô ấy dậy."],["他在家学习。","Tā zài jiā xuéxí.","Anh ấy học ở nhà."]],"n":"Không nói 我去北京明天. Phải nói 我明天去北京.","f":[{"l":1,"s":"他___八点起床。","o":["每天","很","不是"],"a":"每天","t":"Mỗi ngày anh ấy dậy lúc tám giờ.","e":"Từ chỉ thời gian đứng trước động từ."},{"l":1,"s":"我们晚上___家吃饭。","o":["在","去","是"],"a":"在","t":"Buổi tối chúng tôi ăn cơm ở nhà.","e":"在 + địa điểm đứng trước động từ."}],"b":{"l":1,"w":["我","明天","去","北京"],"t":"Ngày mai tôi đi Bắc Kinh.","e":"Thời gian đứng trước động từ."}},{"id":"g1-6","l":1,"t":"Lượng từ","p":"Số + lượng từ + danh từ","e":"Giữa số và danh từ phải có lượng từ: 个 (chung), 本 (sách), 杯 (cốc), 口 (người trong gia đình)... Với số 2 trước lượng từ dùng 两, không dùng 二.","ex":[["我有两个孩子。","Wǒ yǒu liǎng gè háizi.","Tôi có hai đứa con."],["请给我三杯水。","Qǐng gěi wǒ sān bēi shuǐ.","Cho tôi ba cốc nước."],["这本书很贵。","Zhè běn shū hěn guì.","Quyển sách này rất đắt."]],"n":"Sai: 二个人. Đúng: 两个人.","f":[{"l":1,"s":"我买了三___书。","o":["本","个","杯"],"a":"本","t":"Tôi mua ba quyển sách.","e":"Sách dùng lượng từ 本."},{"l":1,"s":"我有___个哥哥。","o":["两","二","零"],"a":"两","t":"Tôi có hai anh trai.","e":"Trước lượng từ dùng 两."}],"b":{"l":1,"w":["请","给我","三杯","茶"],"t":"Làm ơn cho tôi ba tách trà.","e":"Số + lượng từ đứng trước danh từ."}},{"id":"g1-7","l":1,"t":"想, 会, 能, 可以","p":"S + 想/会/能/可以 + V","e":"想: muốn. 会: biết (học mà được) hoặc sẽ. 能: có khả năng hoặc có điều kiện. 可以: được phép. Động từ năng nguyện đứng trước động từ chính.","ex":[["我想学汉语。","Wǒ xiǎng xué Hànyǔ.","Tôi muốn học tiếng Hán."],["他会说英语。","Tā huì shuō Yīngyǔ.","Anh ấy biết nói tiếng Anh."],["这里可以拍照吗？","Zhèlǐ kěyǐ pāizhào ma?","Ở đây được chụp ảnh không?"]],"n":"Phủ định: 不想, 不会, 不能, 不可以.","f":[{"l":1,"s":"我不___游泳。","o":["会","有","在"],"a":"会","t":"Tôi không biết bơi.","e":"会 chỉ kỹ năng học được."},{"l":1,"s":"这里___抽烟吗？","o":["可以","可是","可爱"],"a":"可以","t":"Ở đây được hút thuốc không?","e":"可以 hỏi xin phép."}],"b":{"l":1,"w":["我","想","学","汉语"],"t":"Tôi muốn học tiếng Hán.","e":"想 đứng trước động từ chính."}},{"id":"g2-1","l":2,"t":"了 và 过","p":"V + 了 (hoàn thành)  |  V + 过 (từng)  |  没(有) + V + 过","e":"V + 了 nói hành động đã hoàn thành. V + 过 nói kinh nghiệm “đã từng”. Phủ định của 过 là 没(有) + V + 过, lúc đó bỏ 了.","ex":[["我吃了早饭。","Wǒ chī le zǎofàn.","Tôi đã ăn sáng."],["我去过北京。","Wǒ qùguo Běijīng.","Tôi từng đến Bắc Kinh."],["他没学过日语。","Tā méi xuéguo rìyǔ.","Anh ấy chưa từng học tiếng Nhật."]],"n":"Không nói 我没去了. Phải nói 我没去 hoặc 我没去过.","f":[{"l":2,"s":"我从来没去___中国。","o":["过","了","着"],"a":"过","t":"Tôi chưa bao giờ đến Trung Quốc.","e":"没…过 diễn tả chưa từng."},{"l":2,"s":"下课以后，他马上回___家。","o":["了","着","的"],"a":"了","t":"Tan học xong, anh ấy về nhà ngay.","e":"了 báo hành động đã xong."}],"b":{"l":2,"w":["我","去过","北京"],"t":"Tôi từng đến Bắc Kinh.","e":"去过 = đã từng đi."}},{"id":"g2-2","l":2,"t":"在 và 正在: đang làm gì","p":"S + (正)在 + V (+ 呢)","e":"在 đặt trước động từ nói hành động đang diễn ra. 正在 nhấn mạnh “ngay lúc này”. Cuối câu có thể thêm 呢 cho tự nhiên.","ex":[["我在看电视。","Wǒ zài kàn diànshì.","Tôi đang xem ti vi."],["他正在开会。","Tā zhèngzài kāihuì.","Anh ấy đang họp."],["妈妈在做饭呢。","Māma zài zuòfàn ne.","Mẹ đang nấu cơm."]],"n":"Đừng nhầm với 在 chỉ địa điểm: 他在家 (anh ấy ở nhà).","f":[{"l":2,"s":"他___打电话，你等一下。","o":["正在","已经","常常"],"a":"正在","t":"Anh ấy đang gọi điện, bạn chờ chút.","e":"正在 = đang."},{"l":2,"s":"现在妈妈___做饭呢。","o":["在","了","过"],"a":"在","t":"Bây giờ mẹ đang nấu cơm.","e":"在 + V = đang."}],"b":{"l":2,"w":["他","正在","开会"],"t":"Anh ấy đang họp.","e":"正在 đứng trước động từ."}},{"id":"g2-3","l":2,"t":"So sánh với 比","p":"A + 比 + B + adj (+ 一点儿/多了)  |  A + 没有 + B + adj","e":"比 nối hai đối tượng được so sánh, tính từ đứng sau. Muốn nói hơn nhiều dùng 多了, hơn chút dùng 一点儿. Phủ định: A 没有 B + tính từ.","ex":[["今天比昨天热。","Jīntiān bǐ zuótiān rè.","Hôm nay nóng hơn hôm qua."],["我比他高一点儿。","Wǒ bǐ tā gāo yìdiǎnr.","Tôi cao hơn anh ấy một chút."],["弟弟没有我高。","Dìdi méiyǒu wǒ gāo.","Em trai không cao bằng tôi."]],"n":"Không đặt 很 trước tính từ trong câu 比: sai 他比我很高.","f":[{"l":2,"s":"他___我高。","o":["比","和","在"],"a":"比","t":"Anh ấy cao hơn tôi.","e":"比 dùng để so sánh hơn."},{"l":2,"s":"这个比那个___。","o":["便宜","很便宜","太便宜"],"a":"便宜","t":"Cái này rẻ hơn cái kia.","e":"Sau 比 không dùng 很 hay 太."}],"b":{"l":2,"w":["今天","比","昨天","冷"],"t":"Hôm nay lạnh hơn hôm qua.","e":"比 đứng giữa hai đối tượng."}},{"id":"g2-4","l":2,"t":"因为…所以…","p":"因为 + nguyên nhân，所以 + kết quả","e":"Chỉ nguyên nhân và kết quả. Khác tiếng Việt “vì… nên…”, cặp 因为 / 所以 có thể dùng đủ hai vế, cũng có thể chỉ dùng một vế.","ex":[["因为下雨，所以我没去。","Yīnwèi xiàyǔ, suǒyǐ wǒ méi qù.","Vì trời mưa nên tôi không đi."],["他病了，所以没来上班。","Tā bìng le, suǒyǐ méi lái shàngbān.","Anh ấy ốm nên không đi làm."],["因为很忙，他没吃饭。","Yīnwèi hěn máng, tā méi chīfàn.","Vì bận nên anh ấy không ăn cơm."]],"n":"Không dùng 因为 và 所以 ở cùng một vế.","f":[{"l":2,"s":"___天气不好，我们不去爬山了。","o":["因为","所以","但是"],"a":"因为","t":"Vì thời tiết xấu nên chúng tôi không đi leo núi.","e":"因为 mở đầu vế nguyên nhân."},{"l":2,"s":"他病了，___没来上班。","o":["所以","因为","虽然"],"a":"所以","t":"Anh ấy ốm nên không đi làm.","e":"所以 mở đầu vế kết quả."}],"b":{"l":2,"w":["因为","下雨","所以","我","没去"],"t":"Vì trời mưa nên tôi không đi.","e":"因为 trước 所以."}},{"id":"g2-5","l":2,"t":"要…了: sắp xảy ra","p":"要 / 快要 / 就要 + V + 了","e":"Diễn tả việc sắp xảy ra. 快要 và 就要 nhấn mạnh sắp. Khi có mốc thời gian cụ thể thường dùng 就要.","ex":[["火车要开了。","Huǒchē yào kāi le.","Tàu sắp chạy rồi."],["快要下雨了。","Kuài yào xiàyǔ le.","Sắp mưa rồi."],["他明天就要毕业了。","Tā míngtiān jiù yào bìyè le.","Ngày mai anh ấy sắp tốt nghiệp rồi."]],"n":"Cuối câu luôn có 了.","f":[{"l":2,"s":"天黑了，___下雨了。","o":["快要","很","还"],"a":"快要","t":"Trời tối rồi, sắp mưa rồi.","e":"快要…了 = sắp."},{"l":2,"s":"我们明年就___毕业了。","o":["要","很","太"],"a":"要","t":"Sang năm chúng tôi sắp tốt nghiệp rồi.","e":"就要…了 = sắp."}],"b":{"l":2,"w":["火车","要","开","了"],"t":"Tàu sắp chạy rồi.","e":"要…了 bao quanh động từ."}},{"id":"g2-6","l":2,"t":"Bổ ngữ trạng thái 得","p":"V + 得 + adj  |  V + O + V + 得 + adj","e":"Dùng 得 để đánh giá cách thức hành động (nhanh, tốt, đẹp...). Khi có tân ngữ, lặp lại động từ: 说汉语说得很好.","ex":[["他跑得很快。","Tā pǎo de hěn kuài.","Anh ấy chạy rất nhanh."],["她唱歌唱得很好。","Tā chànggē chàng de hěn hǎo.","Cô ấy hát rất hay."],["我写得不好。","Wǒ xiě de bù hǎo.","Tôi viết không tốt."]],"n":"Phủ định đặt 不 trước tính từ, không đặt trước động từ: 写得不好.","f":[{"l":2,"s":"她唱歌唱___很好。","o":["得","的","地"],"a":"得","t":"Cô ấy hát rất hay.","e":"得 nối động từ với bổ ngữ."},{"l":2,"s":"他写___非常漂亮。","o":["得","的","了"],"a":"得","t":"Anh ấy viết rất đẹp.","e":"V + 得 + adj."}],"b":{"l":2,"w":["他","跑","得","很快"],"t":"Anh ấy chạy rất nhanh.","e":"得 đứng sau động từ."}},{"id":"g2-7","l":2,"t":"一边…一边…: vừa… vừa…","p":"S + 一边 + V1 + 一边 + V2","e":"Hai hành động xảy ra đồng thời, thường là hành động nhẹ làm cùng việc chính.","ex":[["他一边吃饭一边看手机。","Tā yìbiān chīfàn yìbiān kàn shǒujī.","Anh ấy vừa ăn cơm vừa xem điện thoại."],["我们一边走一边聊天。","Wǒmen yìbiān zǒu yìbiān liáotiān.","Chúng tôi vừa đi vừa trò chuyện."],["她一边听音乐一边做作业。","Tā yìbiān tīng yīnyuè yìbiān zuò zuòyè.","Cô ấy vừa nghe nhạc vừa làm bài tập."]],"n":"Hai động từ cùng chủ ngữ.","f":[{"l":2,"s":"他___听音乐，一边做作业。","o":["一边","一起","一直"],"a":"一边","t":"Anh ấy vừa nghe nhạc vừa làm bài tập.","e":"一边…一边… = vừa…vừa…"},{"l":2,"s":"我们一边走，___聊天。","o":["一边","一起","已经"],"a":"一边","t":"Chúng tôi vừa đi vừa trò chuyện.","e":"Vế sau lặp lại 一边."}],"b":{"l":2,"w":["她","一边","走路","一边","打电话"],"t":"Cô ấy vừa đi vừa gọi điện.","e":"一边…一边… đứng trước hai động từ."}},{"id":"g2-8","l":2,"t":"还是 và 或者","p":"Câu hỏi: A 还是 B？  |  Câu trần thuật: A 或者 B","e":"Cùng nghĩa “hoặc” nhưng 还是 dùng trong câu hỏi lựa chọn, còn 或者 dùng trong câu trần thuật.","ex":[["你喝茶还是喝咖啡？","Nǐ hē chá háishi hē kāfēi?","Bạn uống trà hay uống cà phê?"],["星期六或者星期天都可以。","Xīngqīliù huòzhě xīngqītiān dōu kěyǐ.","Thứ Bảy hoặc Chủ Nhật đều được."],["你想吃米饭还是面条？","Nǐ xiǎng chī mǐfàn háishi miàntiáo?","Bạn muốn ăn cơm hay mì?"]],"n":"Đừng dùng 或者 để đặt câu hỏi lựa chọn.","f":[{"l":2,"s":"你想吃米饭___面条？","o":["还是","或者","和"],"a":"还是","t":"Bạn muốn ăn cơm hay mì?","e":"Câu hỏi lựa chọn dùng 还是."},{"l":2,"s":"我周末去爬山___看电影。","o":["或者","还是","不但"],"a":"或者","t":"Cuối tuần tôi đi leo núi hoặc xem phim.","e":"Câu trần thuật dùng 或者."}],"b":{"l":2,"w":["你","喝","茶","还是","咖啡"],"t":"Bạn uống trà hay cà phê?","e":"还是 nối hai lựa chọn trong câu hỏi."}},{"id":"g3-1","l":3,"t":"Câu chữ 把","p":"S + 把 + O + V + thành phần khác","e":"把 đưa tân ngữ (đã xác định) lên trước động từ để nhấn mạnh việc xử lý nó. Sau động từ phải có thêm thành phần như 了, 完, 在…","ex":[["请把门关上。","Qǐng bǎ mén guānshàng.","Xin hãy đóng cửa lại."],["我把作业做完了。","Wǒ bǎ zuòyè zuòwán le.","Tôi làm xong bài tập rồi."],["他把钱包忘在家里了。","Tā bǎ qiánbāo wàng zài jiālǐ le.","Anh ấy để quên ví ở nhà rồi."]],"n":"Không nói 我把书看; phải nói 我把书看完了.","f":[{"l":3,"s":"请___门关上。","o":["把","被","对"],"a":"把","t":"Xin hãy đóng cửa lại.","e":"把 đưa tân ngữ lên trước động từ."},{"l":3,"s":"我把作业做___了。","o":["完","着","过"],"a":"完","t":"Tôi làm xong bài tập rồi.","e":"Sau động từ cần bổ ngữ như 完."}],"b":{"l":3,"w":["我","把作业","做完","了"],"t":"Tôi làm xong bài tập rồi.","e":"把 + tân ngữ + động từ + 完/了."}},{"id":"g3-2","l":3,"t":"Câu bị động 被","p":"O + 被 + (người) + V + thành phần khác","e":"被 đặt trước chủ thể thực hiện hành động, nhấn mạnh tân ngữ chịu tác động, thường dùng cho việc không mong muốn. Có thể bỏ người thực hiện: 我的手机被偷了.","ex":[["我的手机被偷了。","Wǒ de shǒujī bèi tōu le.","Điện thoại của tôi bị trộm mất."],["杯子被他打破了。","Bēizi bèi tā dǎpò le.","Cái cốc bị anh ấy làm vỡ."],["我被老师批评了。","Wǒ bèi lǎoshī pīpíng le.","Tôi bị thầy giáo phê bình."]],"n":"Động từ sau 被 phải có thành phần phía sau, như 了 hoặc bổ ngữ.","f":[{"l":3,"s":"我的自行车___人骑走了。","o":["被","把","对"],"a":"被","t":"Xe đạp của tôi bị người ta lấy đi rồi.","e":"被 mở đầu cấu trúc bị động."},{"l":3,"s":"那本书被他借___了。","o":["走","着","过"],"a":"走","t":"Quyển sách đó bị anh ấy mượn đi rồi.","e":"借走 = mượn đi."}],"b":{"l":3,"w":["杯子","被","弟弟","打破","了"],"t":"Cái cốc bị em trai làm vỡ.","e":"被 + chủ thể + động từ."}},{"id":"g3-3","l":3,"t":"虽然…但是…","p":"虽然 + vế nhượng bộ，但是/可是 + vế chính","e":"Diễn tả “tuy… nhưng…”. Khác tiếng Việt: trong tiếng Trung hai vế thường dùng đủ cả 虽然 và 但是.","ex":[["虽然很累，但是我很高兴。","Suīrán hěn lèi, dànshì wǒ hěn gāoxìng.","Tuy mệt nhưng tôi rất vui."],["虽然他很忙，但是还是来了。","Suīrán tā hěn máng, dànshì háishi lái le.","Tuy bận nhưng anh ấy vẫn đến."],["虽然这个贵，但是很好用。","Suīrán zhège guì, dànshì hěn hǎoyòng.","Tuy cái này đắt nhưng dùng rất tốt."]],"n":"Không dùng 所以 hoặc 而且 trong cặp với 虽然.","f":[{"l":3,"s":"___天气很冷，但是他还是去跑步了。","o":["虽然","因为","如果"],"a":"虽然","t":"Tuy trời lạnh nhưng anh ấy vẫn đi chạy bộ.","e":"虽然 mở đầu vế nhượng bộ."},{"l":3,"s":"虽然这个很贵，___很好用。","o":["但是","所以","而且"],"a":"但是","t":"Tuy cái này đắt nhưng dùng rất tốt.","e":"但是 mở đầu vế chuyển ý."}],"b":{"l":3,"w":["虽然","很累","但是","我","很高兴"],"t":"Tuy mệt nhưng tôi rất vui.","e":"虽然…但是… bao quanh hai vế."}},{"id":"g3-4","l":3,"t":"如果…就…","p":"如果 + điều kiện，(S) 就 + kết quả","e":"Diễn tả giả thiết “nếu… thì…”. 就 đứng trước động từ ở vế kết quả. Có thể thay 如果 bằng 要是 (văn nói).","ex":[["如果明天下雨，我们就不去了。","Rúguǒ míngtiān xiàyǔ, wǒmen jiù bú qù le.","Nếu mai mưa thì chúng tôi không đi nữa."],["如果你有问题，就问我。","Rúguǒ nǐ yǒu wèntí, jiù wèn wǒ.","Nếu bạn có vấn đề thì cứ hỏi tôi."],["要是你累了，就休息一下。","Yàoshi nǐ lèi le, jiù xiūxi yíxià.","Nếu bạn mệt thì nghỉ một chút."]],"n":"就 đứng sau chủ ngữ của vế kết quả, không đứng đầu câu.","f":[{"l":3,"s":"如果你累了，___休息一下吧。","o":["就","才","都"],"a":"就","t":"Nếu bạn mệt thì nghỉ một chút nhé.","e":"就 nối kết quả của giả thiết."},{"l":3,"s":"___明天不忙，我就去看你。","o":["如果","虽然","因为"],"a":"如果","t":"Nếu mai không bận thì tôi sẽ đến thăm bạn.","e":"如果 mở đầu vế điều kiện."}],"b":{"l":3,"w":["如果","你","有空","就","来","吧"],"t":"Nếu bạn rảnh thì đến nhé.","e":"如果 trước 就."}},{"id":"g3-5","l":3,"t":"越来越 và 越…越…","p":"越来越 + adj  |  越 + V1 + 越 + V2/adj","e":"越来越 diễn tả mức độ ngày càng tăng theo thời gian: ngày càng… 越…越… nói hành động tăng thì kết quả cũng tăng: càng… càng…","ex":[["天气越来越冷了。","Tiānqì yuè lái yuè lěng le.","Thời tiết ngày càng lạnh."],["他的汉语越说越好。","Tā de Hànyǔ yuè shuō yuè hǎo.","Tiếng Hán của anh ấy càng nói càng tốt."],["雨越下越大。","Yǔ yuè xià yuè dà.","Mưa càng rơi càng to."]],"n":"Không thêm 很 vào sau 越来越: sai 越来越很好.","f":[{"l":3,"s":"天气___来越冷了。","o":["越","更","最"],"a":"越","t":"Thời tiết ngày càng lạnh.","e":"越来越 = ngày càng."},{"l":3,"s":"他的汉语越来越___。","o":["好","很好","太好"],"a":"好","t":"Tiếng Hán của anh ấy ngày càng tốt.","e":"Sau 越来越 dùng tính từ trần."}],"b":{"l":3,"w":["他的","汉语","越来越","好"],"t":"Tiếng Hán của anh ấy ngày càng tốt.","e":"越来越 + tính từ."}},{"id":"g3-6","l":3,"t":"一…就…: vừa… đã…","p":"S + 一 + V1 + 就 + V2","e":"Diễn tả hai việc nối tiếp ngay lập tức, hoặc một điều kiện dẫn thẳng đến kết quả.","ex":[["我一回家就吃饭。","Wǒ yì huíjiā jiù chīfàn.","Tôi vừa về đến nhà là ăn cơm."],["他一看就懂。","Tā yí kàn jiù dǒng.","Anh ấy vừa nhìn là hiểu."],["她一紧张就说不出话。","Tā yì jǐnzhāng jiù shuō bu chū huà.","Cô ấy cứ căng thẳng là không nói được."]],"n":"就 đứng trước động từ thứ hai.","f":[{"l":3,"s":"我一到家___给你打电话。","o":["就","才","再"],"a":"就","t":"Tôi vừa về đến nhà là gọi cho bạn ngay.","e":"一…就… = vừa… đã…"},{"l":3,"s":"他___看见我就跑。","o":["一","二","不"],"a":"一","t":"Anh ấy vừa thấy tôi là chạy.","e":"一 đứng trước động từ thứ nhất."}],"b":{"l":3,"w":["我","一","下班","就","回家"],"t":"Tôi vừa tan làm là về nhà.","e":"一…就… đứng trước hai động từ."}},{"id":"g3-7","l":3,"t":"除了…以外","p":"除了 + A + 以外，(S) 还/也 + B  |  都 + …","e":"Có hai nghĩa: ngoài A ra còn B nữa (dùng 还/也); hoặc ngoài A ra, tất cả đều… (dùng 都).","ex":[["除了英语以外，他还会说汉语。","Chúle Yīngyǔ yǐwài, tā hái huì shuō Hànyǔ.","Ngoài tiếng Anh, anh ấy còn biết nói tiếng Hán."],["除了小李以外，大家都来了。","Chúle Xiǎo Lǐ yǐwài, dàjiā dōu lái le.","Ngoài Tiểu Lý ra, mọi người đều đến."],["除了苹果，我也喜欢香蕉。","Chúle píngguǒ, wǒ yě xǐhuan xiāngjiāo.","Ngoài táo, tôi cũng thích chuối."]],"n":"以外 có thể lược bỏ trong văn nói.","f":[{"l":3,"s":"除了苹果以外，我___喜欢香蕉。","o":["还","才","就"],"a":"还","t":"Ngoài táo ra, tôi còn thích chuối.","e":"还 mang nghĩa bổ sung."},{"l":3,"s":"除了他以外，大家___去了。","o":["都","还","才"],"a":"都","t":"Ngoài anh ấy ra, mọi người đều đi.","e":"都 mang nghĩa loại trừ."}],"b":{"l":3,"w":["除了","小王","以外","大家","都","来了"],"t":"Ngoài Tiểu Vương ra, mọi người đều đến.","e":"除了…以外 + 都."}},{"id":"g3-8","l":3,"t":"才 và 就","p":"就: sớm, nhanh  |  才: muộn, chậm","e":"就 đặt trước động từ khi người nói cho rằng việc xảy ra sớm hoặc nhanh. 才 cho rằng muộn, chậm hoặc khó khăn.","ex":[["他六点就起床了。","Tā liù diǎn jiù qǐchuáng le.","Anh ấy sáu giờ đã dậy rồi."],["我八点才起床。","Wǒ bā diǎn cái qǐchuáng.","Tám giờ tôi mới dậy."],["她三天就学会了。","Tā sān tiān jiù xuéhuì le.","Cô ấy chỉ ba ngày đã học được."]],"n":"就 thường đi với 了 ở cuối; 才 thường không có 了.","f":[{"l":3,"s":"他八点上班，七点___到了。","o":["就","才","再"],"a":"就","t":"Anh ấy tám giờ làm việc, bảy giờ đã đến rồi.","e":"就 = sớm hơn dự kiến."},{"l":3,"s":"昨天太忙了，我十二点___睡。","o":["才","就","再"],"a":"才","t":"Hôm qua bận quá, mười hai giờ tôi mới ngủ.","e":"才 = muộn hơn dự kiến."}],"b":{"l":3,"w":["他","六点","就","起床","了"],"t":"Anh ấy sáu giờ đã dậy rồi.","e":"就 đứng trước động từ."}},{"id":"g4-1","l":4,"t":"无论…都…","p":"无论 + (疑问词/A 还是 B)，都 + kết quả","e":"Dù trong điều kiện nào, kết quả vẫn không đổi. Sau 无论 thường là từ nghi vấn (谁, 什么, 怎么…) hoặc hai lựa chọn.","ex":[["无论天气怎么样，他都去跑步。","Wúlùn tiānqì zěnmeyàng, tā dōu qù pǎobù.","Dù thời tiết ra sao, anh ấy vẫn đi chạy."],["无论谁来，我们都欢迎。","Wúlùn shéi lái, wǒmen dōu huānyíng.","Dù ai đến, chúng tôi đều hoan nghênh."],["无论多难，我都要完成。","Wúlùn duō nán, wǒ dōu yào wánchéng.","Dù khó đến mấy, tôi cũng phải hoàn thành."]],"n":"Vế sau gần như luôn có 都 hoặc 也.","f":[{"l":4,"s":"无论多难，我___要完成。","o":["都","才","就"],"a":"都","t":"Dù khó đến mấy tôi cũng phải hoàn thành.","e":"无论…都… không đổi kết quả."},{"l":4,"s":"___你去不去，我都去。","o":["无论","即使","如果"],"a":"无论","t":"Dù bạn đi hay không, tôi cũng đi.","e":"无论 mở đầu vế điều kiện."}],"b":{"l":4,"w":["无论","谁","来","我们","都","欢迎"],"t":"Dù ai đến chúng tôi cũng hoan nghênh.","e":"无论 + từ nghi vấn + 都."}},{"id":"g4-2","l":4,"t":"不但…而且…","p":"不但/不仅 + A，而且/还 + B","e":"Diễn tả tăng tiến “không những… mà còn…”. Hai vế cùng chiều ý nghĩa, vế sau thường mạnh hơn.","ex":[["她不但聪明，而且很努力。","Tā búdàn cōngming, érqiě hěn nǔlì.","Cô ấy không những thông minh mà còn rất chăm chỉ."],["这个手机不仅便宜，而且质量好。","Zhège shǒujī bùjǐn piányi, érqiě zhìliàng hǎo.","Chiếc điện thoại này không những rẻ mà chất lượng còn tốt."],["他不但会唱歌，还会跳舞。","Tā búdàn huì chànggē, hái huì tiàowǔ.","Anh ấy không những biết hát mà còn biết nhảy."]],"n":"Không dùng 但是 hoặc 所以 thay cho 而且.","f":[{"l":4,"s":"他不但会唱歌，___会跳舞。"," ,"s":"只要你愿意，我___帮你。","o":["就","才","却"],"a":"就","t":"Chỉ cần bạn muốn là tôi giúp bạn.","e":"只要 đi với 就."}],"b":{"l":4,"w":["只要","你","同意","就","可以","开始"],"t":"Chỉ cần bạn đồng ý là có thể bắt đầu.","e":"只要…就… = điều kiện đủ."}},{"id":"g4-5","l":4,"t":"连…也/都…: ngay cả…","p":"连 + A + 也/都 + …","e":"连 nhấn mạnh một ví dụ cực đoan: ngay cả A cũng/đều… Thường đi với 也 hoặc 都.","ex":[["他忙得连饭也没吃。","Tā máng de lián fàn yě méi chī.","Anh ấy bận đến nỗi cơm cũng không ăn."],["连小孩子都知道。","Lián xiǎoháizi dōu zhīdào.","Ngay cả trẻ con cũng biết."],["这个问题连老师都不会。","Zhège wèntí lián lǎoshī dōu bú huì.","Câu hỏi này ngay cả thầy giáo cũng không biết."]],"n":"A thường là tình huống đặc biệt hoặc cực đoan.","f":[{"l":4,"s":"他太累了，___饭都不想吃。","o":["连","把","被"],"a":"连","t":"Anh ấy mệt quá, ngay cả cơm cũng không muốn ăn.","e":"连 nhấn mạnh ví dụ cực đoan."},{"l":4,"s":"这个问题很简单，___小学生都会。","o":["连","对","给"],"a":"连","t":"Câu hỏi này rất dễ, ngay cả học sinh tiểu học cũng biết.","e":"连…都… = ngay cả… cũng…"}],"b":{"l":4,"w":["连","小孩子","都","知道"],"t":"Ngay cả trẻ con cũng biết.","e":"连 + A + 都."}},{"id":"g4-6","l":4,"t":"对…来说 và 对…感兴趣","p":"对 + người/việc + 来说，…  |  对 + A + 感兴趣","e":"对…来说: xét từ góc độ của ai, “đối với… mà nói”. 对…感兴趣: hứng thú với… 对 dẫn vào đối tượng của thái độ hoặc hành động.","ex":[["对我来说，健康最重要。","Duì wǒ lái shuō, jiànkāng zuì zhòngyào.","Đối với tôi, sức khỏe là quan trọng nhất."],["他对音乐很感兴趣。","Tā duì yīnyuè hěn gǎn xìngqù.","Anh ấy rất hứng thú với âm nhạc."],["这件事对公司很重要。","Zhè jiàn shì duì gōngsī hěn zhòngyào.","Việc này rất quan trọng đối với công ty."]],"n":"对 đứng trước đối tượng, không đứng sau như “với” trong một số cấu trúc tiếng Việt.","f":[{"l":4,"s":"___我来说，健康最重要。","o":["对","给","跟"],"a":"对","t":"Đối với tôi, sức khỏe là quan trọng nhất.","e":"对…来说 = đối với…"},{"l":4,"s":"他对中国文化很___兴趣。","o":["感","做","看"],"a":"感","t":"Anh ấy rất hứng thú với văn hóa Trung Quốc.","e":"对…感兴趣 = hứng thú với…"}],"b":{"l":4,"w":["他","对","音乐","很","感兴趣"],"t":"Anh ấy rất hứng thú với âm nhạ let CMAP={};

const $=s=>document.querySelector(s);
const KEY='hanngu_hsk_v1';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S=Object.assign({ws:{},errs:{},vid:{},custom:[],streak:0,last:'',passed:{},voice:'',rate:0.8,py:true,log:{},goal:{c:10,q:20},bk:0},S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const day=d=>new Date(d).toLocaleDateString('sv-SE');
function markActive(){const t=day(Date.now());if(S.last===t)return;S.streak=S.last===day(Date.now()-864e5)?S.streak+1:1;S.last=t;save()}
function streakNow(){return(S.last===day(Date.now())||S.last===day(Date.now()-864e5))?S.streak:0}
let WORDS=[],LESSONS=[],WBY={};
function build(){
  WORDS=[];LESSONS=[];
  const SEEN=new Set();
  for(const k of [RAW,RAWX,RAWIMG])for(const lv in k)k[lv].forEach(([tt,b])=>b.split('\n').forEach(r=>SEEN.add(r.split('|')[0].trim())));
  for(const l of [1,2,3,4]){
    [...(RAW[l]||[]),...(RAWX[l]||[]),...(RAWIMG[l]||[])].forEach(([t,b],i)=>{
      const ws=b.split('\n').map(r=>{const [h,p,m,hv]=r.split('|');return{h:h.trim(),p:p.trim(),m:m.trim(),hv:(hv||'').trim(),l}});
      LESSONS.push({id:l+'-'+(i+1),l,t,ws:ws.map(w=>w.h)});WORDS.push(...ws);
    });
    (RAWW[l]||[]).forEach(([tt,b],i)=>{
      const rows=b.split('\n').map(r=>{const [h,p,m,hv]=r.split('|');return{h:h.trim(),p:p.trim(),m:m.trim(),hv:(hv||'').trim(),l}});
      LESSONS.push({id:l+'w'+(i+1),l,t:tt,ws:rows.map(w=>w.h)});WORDS.push(...rows.filter(w=>{if(SEEN.has(w.h))return false;SEEN.add(w.h);return true}));
    });
    const cu=S.custom.filter(w=>w.l===l);
    if(cu.length){LESSONS.push({id:'c'+l,l,t:'Từ bạn thêm',ws:cu.map(w=>w.h)});WORDS.push(...cu)}
  }
  WBY=Object.fromEntries(WORDS.map(w=>[w.h,w]));
  CMAP={};WORDS.forEach(w=>{if([...w.h].length===1)CMAP[w.h]=w.p});TONES.forEach(t=>{CMAP[t[0]]=t[1]});
}
build();
const learned=ids=>ids.filter(h=>(S.ws[h]||{}).box>=3).length;

/* ---------- Âm thanh & kiểm tra pinyin ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
let VOICES=[];
const isCanto=v=>/^yue|zh[-_]hk/i.test(v.lang)||/cantonese|粤|廣|广东|sin-?ji|hiu-?maan|wan-?lung/i.test(v.name);
function vScore(v){
  let s=0;
  if(/^(zh[-_]cn|cmn[-_]cn|zh[-_]hans)/i.test(v.lang))s+=100;else if(/^(zh[-_]tw|cmn[-_]tw)/i.test(v.lang))s+=40;
  if(/natural|online/i.test(v.name))s+=30;
  if(/xiaoxiao|yunxi|yunyang|xiaoyi|yunjian|yunxia/i.test(v.name))s+=20;
  if(/google/i.test(v.name))s+=15;
  if(/ting-?ting|li-?li|lili|mei-?jia|li-?mu/i.test(v.name))s+=10;
  return s;
}
const vLabel=v=>/^(zh[-_]tw|cmn[-_]tw)/i.test(v.lang)?'Phổ thông (Đài Loan)':'Phổ thông (Trung Quốc)';
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  VOICES=speechSynthesis.getVoices().filter(v=>(/^(zh|cmn)/i.test(v.lang)||/chinese|mandarin|普通话|中文/i.test(v.name))&&!isCanto(v)).sort((x,y)=>vScore(y)-vScore(x));
}
function pickVoice(){
  return VOICES.find(v=>v.name===S.voice)||VOICES[0]||null;
}
function speak(t,o){
  if(!('speechSynthesis' in window))return toast('Trình duyệt này chưa hỗ trợ đọc tiếng Trung.');
  loadVoices();
  speechSynthesis.cancel();
  const v=pickVoice(),n=Math.max(1,Math.min(5,(o&&o.times)||1));
  for(let k=0;k<n;k++){
    const u=new SpeechSynthesisUtterance(t);
    u.lang=v?v.lang:'zh-CN';u.rate=(o&&o.rate)||S.rate||0.8;
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }
  if(!v)toast('Máy chưa có giọng tiếng Trung. Vào tab Luyện tập, mục Giọng đọc, để xem cách thêm.');
}
function voiceCard(){
  if(!('speechSynthesis' in window))return '<div class="card"><h2>Giọng đọc tiếng Trung</h2><p class="muted">Trình duyệt này không hỗ trợ đọc thành tiếng. Hãy thử Chrome, Edge hoặc Safari.</p></div>';
  const cur=pickVoice(),rate=(S.rate||0.8).toFixed(1);
  const opts=VOICES.map((v,i)=>`<option value="${esc(v.name)}" ${cur&&v.name===cur.name?'selected':''}>${esc(v.name)} · ${vLabel(v)}${i===0?' (khuyên dùng)':''}</option>`).join('');
  return `<div class="card"><h2>Giọng đọc tiếng Trung</h2>
  ${VOICES.length?`<label for="vsel">Chọn giọng</label><select id="vsel">${opts}</select><p class="muted">App tự xếp giọng Phổ thông Trung Quốc (chuẩn của HSK) lên đầu và ẩn giọng Quảng Đông để bạn không học nhầm.</p>`:`<p><b>Máy này chưa có giọng tiếng Trung.</b> Thêm giọng trong cài đặt hệ thống rồi tải lại trang (tên mục có thể khác tùy phiên bản):</p>
  <p class="muted">Windows: Cài đặt → Thời gian và ngôn ngữ → Ngôn ngữ và khu vực → thêm Tiếng Trung (Giản thể), tải gói giọng nói.<br>Android: Cài đặt → Chuyển văn bản thành giọng nói → Google → tải dữ liệu giọng tiếng Trung.<br>iPhone/iPad: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Trung → tải giọng.<br>macOS: Cài đặt → Trợ năng → Nội dung được nói → Giọng hệ thống → Quản lý giọng nói → tiếng Trung.</p>`}
  <label for="vrate">Tốc độ đọc: <span id="vr">${rate}</span>x</label><input id="vrate" type="range" min="0.5" max="1.2" step="0.1" value="${rate}">
  <div class="row2"><button class="btn p" data-act="say" data-t="你好，欢迎学习汉语。">${ICON} Nghe thử</button><button class="btn" data-act="vreload">Tải lại danh sách giọng</button></div></div>`;
}
function pyParse(s){
  let L='',T=[];
  for(const c of String(s).toLowerCase().normalize('NFD')){
    const k=c.charCodeAt(0);
    if(k===0x304)T.push(1);else if(k===0x301)T.push(2);else if(k===0x30c)T.push(3);else if(k===0x300)T.push(4);
    else if(k===0x308)L=L.replace(/u$/,'v');
    else if(/[1-4]/.test(c))T.push(+c);
    else if(/[a-zü]/.test(c))L+=(c==='ü'?'v':c);
  }
  return{L,T};
}
function checkPy(inp,ans){const a=pyParse(ans),b=pyParse(inp),t=a.T.join()===b.T.join(),l=a.L===b.L;return{ok:l&&t,letters:l,tones:t}}

/* ---------- Nhận dạng giọng nói (kiểm tra phát âm) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const normZh=s=>String(s).replace(/10/g,'十').replace(/\d/g,d=>'零一二三四五六七八九'[d]).replace(/[\s\u3000，。！？、；：“”‘’"'.,!?;:…（）()\-—·]/g,'');
function lcsMask(T,H){
  const a=[...T],b=[...H],n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const mask=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){mask[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return mask;
}
function pyOf(s){
  const w=WBY[s];if(w&&typeof w==='object')return w.p;
  const cs=[...s];return cs.length&&cs.every(c=>CMAP[c])?cs.map(c=>CMAP[c]).join(''):'';
}
function speechTip(T,h){
  if(!h)return 'Máy chưa nhận ra từ nào. Hãy nói to và rõ hơn, từng từ một.';
  const A=[...T],B=[...h],tp=pyOf(T),hp=pyOf(h);
  if(tp&&hp&&A.length===B.length){const x=pyParse(tp),y=pyParse(hp);if(x.L===y.L&&x.T.join()!==y.T.join())return `Đúng âm tiết nhưng <b>sai thanh điệu</b>: cần <b>${esc(tp)}</b>, máy nghe thành <b>${esc(hp)}</b>.`}
  if(A.length===B.length){
    const tl=[];
    A.forEach((c,i)=>{if(c!==B[i]&&CMAP[c]&&CMAP[B[i]]){const x=pyParse(CMAP[c]),y=pyParse(CMAP[B[i]]);if(x.L===y.L&&x.T.join()!==y.T.join())tl.push(c+': cần '+CMAP[c]+', máy nghe '+B[i]+' ('+CMAP[B[i]]+')')}});
    if(tl.length)return 'Có thể <b>sai thanh điệu</b> ở: '+tl.map(esc).join('; ')+'.';
  }
  return 'Hãy nghe mẫu rồi đọc lại chậm hơn, chú ý các chữ màu đỏ.';
}
function evalSpeech(target,alts){
  const T=normZh(target),len=[...T].length;let best=null;
  for(const a of alts){
    const h=normZh(a.t),m=lcsMask(T,h),n=m.filter(Boolean).length,ok=h===T;
    if(!best||ok||n>best.n)best={raw:a.t,h,m,n,ok};
    if(ok)break;

    h+=`<div class="slot">${Q.built.map(i=>`<button class="tok" data-act="unplace" data-i="${i}" ${Q.fb?'disabled':''}>${optHTML(q.tokens[i])}</button>`).join('')}</div>

  }
  if(Q.fb){
    const f=Q.fb;
    h+=`<div class="fb ${f.ok?'':'bad'}"><b>${f.ok?'Chính xác':'Chưa đúng'}</b>${f.ok&&f.extra?'<div>'+f.extra+'</div>':''}${f.ok?'':`<p>Đáp án đúng: ${hzp(q.ans)}${f.extra?'<br>'+f.extra:''}</p>`}<p>${q.exp}</p>${!f.ok&&!q.retry&&Q.mode==='practice'?'<small>Câu này sẽ quay lại ở cuối bài để bạn làm lại.</small>':''}</div>

}
function viewResult(){

  const show=Q.mode==='test'?first:first.filter(x=>!x.ok);
  return `<div class="card"><h2>Kết quả: ${ok}/${first.length} (${pct}%)</h2><p>${msg}</p>

}

/* ---------- Mục tiêu, thống kê tuần ---------- */
const GOAL_C=[10,20,30,50],GOAL_Q=[10,20,40,60];
function tl(){const k=day(Date.now());if(!S.log[k]){const old=day(Date.now()-90*864e5);Object.keys(S.log).forEach(x=>{if(x<old)delete S.log[x]});S.log[k]={c:0,n:0,q:0,ok:0}}return S.log[k]}
function weekData(){const out=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=day(d),v=S.log[k]||{c:0,n:0,q:0,ok:0};out.push({k,w:['CN','T2','T3','T4','T5','T6','T7'][d.getDay()],v})}return out}
function goalCard(){
  const tk=day(Date.now()),t=S.log[tk]||{c:0,n:0,q:0,ok:0},g=S.goal||{c:10,q:20},wk=weekData();
  const tot=wk.reduce((a,x)=>({c:a.c+x.v.c,q:a.q+x.v.q,ok:a.ok+x.v.ok,d:a.d+((x.v.c+x.v.q)>0?1:0),n:a.n+x.v.n}),{c:0,q:0,ok:0,d:0,n:0});
  const mx=Math.max(1,...wk.map(x=>x.v.c+x.v.q));
  const pc=Math.min(100,Math.round(t.c/g.c*100)),pq=Math.min(100,Math.round(t.q/g.q*100));
  const acc=tot.q?Math.round(tot.ok/tot.q*100)+'%':'—';
  const sel=(id,arr,v)=>`<select id="${id}">${arr.map(x=>`<option value="${x}" ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  return `<div class="card"><h2>Mục tiêu hôm nay${(t.c>=g.c&&t.q>=g.q)?' <span class="chip ok">Đạt</span>':''}</h2>
  <div class="goal"><div><small>Thẻ học: <b>${t.c}</b>/${g.c}</small><div class="bar"><i style="width:${pc}%"></i></div></div>
  <div><small>Câu luyện tập: <b>${t.q}</b>/${g.q}</small><div class="bar"><i style="width:${pq}%"></i></div></div></div>
  <div class="week" role="img" aria-label="Hoạt động 7 ngày gần nhất">${wk.map(x=>{const a=x.v.c+x.v.q;return `<div class="wd${x.k===tk?' today':''}"><i style="height:${a?Math.max(6,Math.round(a/mx*56)):2}px" title="${a} lượt"></i><small>${x.w}</small></div>`}).join('')}</div>
  <p class="muted"><small>7 ngày qua: học <b>${tot.d}</b>/7 ngày · <b>${tot.c}</b> thẻ (<b>${tot.n}</b> từ mới) · <b>${tot.q}</b> câu · đúng <b>${acc}</b></small></p>
  <div class="gset"><div><label for="gc"><small>Thẻ mỗi ngày</small></label>${sel('gc',GOAL_C,g.c)}</div><div><label for="gq"><small>Câu mỗi ngày</small></label>${sel('gq',GOAL_Q,g.q)}</div></div></div>`;
}

/* ---------- Điều khiển ---------- */
function render(){
  const v={map:viewMap,pinyin:viewPinyin,study:viewStudy,practice:viewPractice,errors:viewErrors,add:viewAdd,read:viewRead,gram:viewGrammar,quiz:viewQuiz}[VIEW];
  $('#main').innerHTML=v();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===VIEW?'page':'false'));
  if(VIEW==='quiz'&&Q&&Q.list[Q.i]&&Q.list[Q.i].kind==='type'&&!Q.fb){const i=$('#tin');if(i)i.focus({preventScroll:true})}
}
function go(v){clearInterval(TM);stopListen();Q=null;ST=null;VEDIT=null;RESET=false;RD=null;VIEW=v;render();window.scrollTo(0,0)}
function startQuiz(list,o){
  if(!list.length)return toast('Chưa có đủ nội dung cho lựa chọn này.');
  list=list.map(q=>{q=Object.assign({},q,{retry:false});if(q.kind==='build')q.tokens=shuffle(q.tokens);else if(q.kind==='mc'&&!q.fixed)q.opts=shuffle(q.opts);return q});
  clearInterval(TM);
  Q=Object.assign({list,i:0,res:[],fb:null,built:[],end:o.limit?Date.now()+o.limit:0},o);
  VIEW='quiz';markActive();render();window.scrollTo(0,0);
  if(Q.end)TM=setInterval(()=>{const r=Q.end-Date.now();if(r<=0){finishTest();return}const e=$('#tm');if(e)e.textContent=fmt(r)},1000);
}
function commit(q,ok,given){
  Q.res.push({q,ok,given});
  if(given!=='(chưa trả lời)'){const tt=tl();tt.q++;if(ok)tt.ok++}
  if(!ok){addErr(q,given);if(q.wid)S.ws[q.wid]=Object.assign({seen:0},S.ws[q.wid],{box:0,due:Date.now()});if(Q.mode==='practice'&&!q.retry)Q.list.push(Object.assign({},q,{retry:true}))}
  else bumpFix(q);
  save();
}
function answer(ok,given,extra,pick){
  const q=Q.list[Q.i];commit(q,ok,given);
  if(Q.mode==='test')advance();else{Q.fb={ok,given,extra,pick};render()}
}
function advance(){Q.i++;Q.fb=null;Q.built=[];render();window.scrollTo(0,0)}
function finishTest(){clearInterval(TM);while(Q.i<Q.list.length){commit(Q.list[Q.i],false,'(chưa trả lời)');Q.i++}render()}
function stStart(sc){
  const now=Date.now(),pool=sc==='auto'?LESSONS:LESSONS.filter(l=>l.id===sc),nw=[];
  const inScope=new Set(pool.flatMap(l=>l.ws));
  const due=shuffle(WORDS.filter(w=>inScope.has(w.h)&&S.ws[w.h]&&S.ws[w.h].due<=now)).map(w=>w.h);
  for(const l of pool){for(const h of l.ws){if(!S.ws[h]&&nw.length<10)nw.push(h)}if(nw.length>=10)break}
  const q=due.concat(nw).slice(0,25);
  if(!q.length)return toast('Hôm nay chưa có thẻ nào cần học.');
  ST={q,i:0,flip:false,ok:0,again:0};markActive();render();
}
function startTest(l){startQuiz(gen('L'+l,'mix',12),{mode:'test',title:'Thi thử HSK '+l,level:l,limit:12*60*1000,again:()=>startTest(l)})}
function startPractice(sc,m){const t=scopeInfo(sc).t;startQuiz(gen(sc,m,10),{mode:'practice',title:t,again:()=>startPractice(sc,m)})}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'nav':go(d.v);break;
    case 'say':speak(d.t);break;
    case 'vreload':loadVoices();render();toast('Tìm thấy '+VOICES.length+' giọng tiếng Trung.');break;
    case 'learn':ST=null;VIEW='study';stStart(d.id);break;
    case 'lpractice':startPractice(d.id,'mix');break;
    case 'tonepractice':startPractice('all','tone');break;
    case 'test':startTest(+d.l);break;
    case 'vedit':VEDIT=VEDIT===d.id?null:d.id;render();break;
    case 'vsave':{const v=($('#vin').value||'').trim();if(v&&!/^https:\/\//i.test(v))return toast('Link cần bắt đầu bằng https://');if(v)S.vid[d.id]=v;else delete S.vid[d.id];VEDIT=null;save();render();break}
    case 'stStart':stStart($('#sc').value);break;
    case 'flip':ST.flip=true;render();break;
    case 'rate':{const id=ST.q[ST.i],ws=Object.assign({box:0,due:0,seen:0},S.ws[id]);ws.seen++;{const tt=tl();tt.c++;if(ws.seen===1)tt.n++}
      if(d.v==='1'){ws.box=Math.min(ws.box+1,5);ws.due=Date.now()+INT[ws.box]*864e5;ST.ok++}else{ws.box=0;ws.due=Date.now();ST.again++;ST.q.push(id)}
      S.ws[id]=ws;ST.i++;ST.flip=false;save();render();break}
    case 'mic':{const q=Q.list[Q.i];startListen('q',q.ans,r=>{if(Q&&Q.list[Q.i]===q&&!Q.fb)answer(r.ok,r.raw,speechHTML(q.ans,r))});break}
    case 'skip':stopListen();Q.list.splice(Q.i,1);Q.built=[];Q.fb=null;render();break;
    case 'rdopen':stopListen();Q=null;ST=null;VIEW='read';RD={id:d.id,py:true,vi:true,res:{},mode:'read',spd:0.8,rep:1,show:{},dc:{},dcv:{}};render();window.scrollTo(0,0);break;
    case 'rdback':stopListen();RD=null;render();break;
    case 'rdtog':RD[d.v]=!RD[d.v];render();break;
    case 'rdall':{const t=textById(RD.id);speak(t.lines.map(l=>l[1]).join(' '),{rate:RD.spd});break}
    case 'rdmic':{const t=textById(RD.id),i=+d.i,zh=t.lines[i][1];startListen('r'+i,zh,r=>{if(RD){RD.res[i]=speechHTML(zh,r);render()}});break}
    case 'rdquiz':stopListen();startRead(textById(RD.id));break;
    case 'pmode':startPractice($('#ps').value,d.m);break;
    case 'pick':{const q=Q.list[Q.i],i=+d.i;answer(q.opts[i]===q.ans,q.opts[i],'',i);break}
    case 'check':{const q=Q.list[Q.i];
      if(q.kind==='type'){const v=($('#tin').value||'').trim();if(!v)return;const r=checkPy(v,q.ans);answer(r.ok,v,(!r.ok&&r.letters&&!r.tones)?'Bạn đọc đúng âm tiết nhưng sai thanh điệu.':'')}
      else{const g=Q.built.map(i=>q.tokens[i]).join('');answer(g===q.ans,g,'')}
      break}
    case 'place':Q.built.push(+d.i);render();break;
    case 'unplace':Q.built=Q.built.filter(i=>i!==+d.i);render();break;
    case 'clear':Q.built=[];render();break;
    case 'next':advance();break;
    case 'again':Q.again();break;
    case 'errf':ERRF=d.v;render();break;
    case 'rkf':RK=d.v;render();break;
    case 'workread':stopListen();Q=null;ST=null;RD=null;RK='work';VIEW='read';render();window.scrollTo(0,0);break;
    case 'gpr':gramQuiz(d.id);break;
    case 'gprl':gramLevel(+d.l);break;
    case 'rsay':speak(textById(RD.id).lines[+d.i][1],{rate:RD.spd,times:RD.rep});break;
    case 'rmode':stopListen();RD.mode=d.v;render();break;
    case 'rspd':RD.spd=+d.v;render();break;
    case 'rrep':RD.rep=+d.v;render();break;
    case 'rshow':RD.show[d.i]=!RD.show[d.i];render();break;
    case 'rshowall':{const t=textById(RD.id),all=t.lines.every((l,i)=>RD.show[i]);t.lines.forEach((l,i)=>{RD.show[i]=!all});render();break}
    case 'dcheck':{
      const t=textById(RD.id),i=+d.i,ln=t.lines[i],inp=(($('#dc'+i)||{}).value||'').trim();
      if(!inp)return toast('Hãy gõ nội dung bạn nghe được.');
      let ok,msg;
      if(HAN.test(inp)){
        const a=normZh(ln[1]).replace(/[^一-鿿]/g,''),b=normZh(inp).replace(/[^一-鿿]/g,'');
        ok=a===b;msg=ok?'Chính xác!':'Chưa đúng, hãy so với đáp án bên dưới.';
      }else{
        const c=checkPy(inp,ln[2]),hasT=pyParse(inp).T.length>0;
        if(!c.letters){ok=false;msg='Chưa đúng, hãy so với đáp án bên dưới.'}
        else if(!hasT){ok=true;msg='Đúng âm. Bạn chưa gõ thanh điệu nên chưa kiểm tra được thanh.'}
        else if(c.tones){ok=true;msg='Chính xác cả âm và thanh điệu!'}
        else{ok=false;msg='Đúng âm nhưng sai thanh điệu.'}
      }
      RD.dcv=RD.dcv||{};RD.dcv[i]=inp;RD.dc[i]={ok,msg};
      {const tt=tl();tt.q++;if(ok)tt.ok++;save()}
      render();break}
    case 'bkexp':{
      S.bk=Date.now();save();
      const b=new Blob([backupJSON()],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download='hanngu-hsk-backup-'+day(Date.now())+'.json';
      document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
      toast('Đã tạo file sao lưu. Hãy cất file ở nơi an toàn.');render();break}
    case 'bkcopy':{
      try{S.bk=Date.now();save();navigator.clipboard.writeText(backupJSON()).then(()=>{toast('Đã sao chép. Dán vào một file .json để lưu lại.');render()}).catch(()=>toast('Không sao chép được. Hãy dùng nút Xuất file.'))}catch(x){toast('Không sao chép được. Hãy dùng nút Xuất file.')}
      break}
    case 'pytog':S.py=S.py===false;save();applyPy();break;
    case 'errdel':delete S.errs[d.k];save();render();break;
    case 'errreview':{const l=Object.values(S.errs).filter(e=>ERRF==='all'||e.q.type===ERRF).map(e=>e.q);startQuiz(shuffle(l).slice(0,15),{mode:'review',title:'Ôn lỗi sai',again:()=>go('errors')});break}
    case 'addwords':{
      const lv=+$('#al').value,rows=$('#aw').value.split('\n').map(r=>r.trim()).filter(Boolean);let n=0;
      for(const r of rows){const f=r.split('|').map(x=>x.trim());if(f.length<3||!f[0]||!f[1]||!f[2]||WBY[f[0]])continue;S.custom.push({h:f[0],p:f[1],m:f[2],hv:f[3]||'',l:lv});WBY[f[0]]=1;n++}
      if(!n)return toast('Không có dòng hợp lệ. Mỗi dòng cần ít nhất: chữ Hán|pinyin|nghĩa (từ trùng sẽ bị bỏ qua).');
      save();build();toast('Đã thêm '+n+' từ vào HSK '+lv);render();break}
    case 'reset':
      if(!RESET){RESET=true;render();break}
      try{localStorage.removeItem(KEY)}catch(x){}
      S={ws:{},errs:{},vid:{},custom:[],streak:0,last:'',passed:{},voice:S.voice,rate:S.rate,py:S.py,log:{},goal:{c:10,q:20},bk:0};build();RESET=false;toast('Đã xóa tiến độ.');render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^dc\d+$/.test(e.target.id)){const b=document.querySelector('[data-act="dcheck"][data-i="'+e.target.id.slice(2)+'"]');if(b)b.click()}if(e.key==='Enter'&&e.target.id==='tin'){const b=document.querySelector('[data-act="check"]');if(b)b.click()}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='vsel'){S.voice=e.target.value;save()}
  if(id==='gc'||id==='gq'){S.goal=Object.assign({c:10,q:20},S.goal);S.goal[id==='gc'?'c':'q']=+e.target.value;save();render()}
  if(id==='bkfile'&&e.target.files&&e.target.files[0]){const f=e.target.files[0];f.text().then(importBackup).catch(()=>toast('Không đọc được file.'));e.target.value=''}
});
document.addEventListener('input',e=>{if(RD&&/^dc\d+$/.test(e.target.id)){RD.dcv=RD.dcv||{};RD.dcv[+e.target.id.slice(2)]=e.target.value}if(e.target.id==='vrate'){S.rate=+e.target.value;const r=$('#vr');if(r)r.textContent=S.rate.toFixed(1);save()}});
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if((VIEW==='practice')||(VIEW==='read')||(VIEW==='study'&&!ST))render()}}
applyPy();render();
</script>
